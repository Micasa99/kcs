apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcs-v2-api
  namespace: researchcosmos-v2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcs-v2-workload
  namespace: researchcosmos-v2
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kcs-v2-api
  namespace: researchcosmos-v2
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kcs-v2-api
  namespace: researchcosmos-v2
subjects:
  - kind: ServiceAccount
    name: kcs-v2-api
    namespace: researchcosmos-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kcs-v2-api
