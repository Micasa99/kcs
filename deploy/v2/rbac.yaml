apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcs-v2-api
  namespace: researchcosmos-v2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcs-v2-workload
  namespace: researchcosmos-v2
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kcs-v2-api
  namespace: researchcosmos-v2
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # Kubernetes authorizes WebSocket pod exec as `create`; `get` alone
    # rejects every supervisor/sidecar RPC at the handshake (403).
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kcs-v2-api
  namespace: researchcosmos-v2
subjects:
  - kind: ServiceAccount
    name: kcs-v2-api
    namespace: researchcosmos-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kcs-v2-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcs-v2-capacity-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcs-v2-capacity-reader
subjects:
  - kind: ServiceAccount
    name: kcs-v2-api
    namespace: researchcosmos-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcs-v2-capacity-reader
