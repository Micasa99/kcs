apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcs-v2-beta-capacity-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcs-v2-beta-capacity-reader
subjects:
  - kind: ServiceAccount
    name: kcs-v2-beta-api
    namespace: researchcosmos-v2-beta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcs-v2-beta-capacity-reader
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kcs-v2-beta-low
value: -1000
globalDefault: false
preemptionPolicy: Never
description: Non-preempting KCS Beta workload priority.
