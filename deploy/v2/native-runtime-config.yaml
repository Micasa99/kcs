  recipes.json: |
    {"version":1,"recipes":[]}
  # Capability bundles are independently deny-by-default. Operators copy only
  # reviewed exact pins from native-capability-registry.example.json.
  capabilities.json: |
    {"version":1,"capabilities":[]}
  openvscode-image-volume: 10.255.250.1:5000/researchcosmos/rc-openvscode-server@sha256:f81187d7c9480c74cddbc3eec3955c239d492b4fbc1cb023b14c154f8b2d4e40
  dev-session-relay-image: 10.255.250.1:5000/researchcosmos/rc-dev-session-relay@sha256:7c684bc24bd04b2dd883b56c40d3df9674e01b1d292aaa4d3084ce3008ebaa04
  project-workspace-control-image: 10.255.250.1:5000/researchcosmos/kcs-control@sha256:9b1bf603ace7bb084d14be293526d0b48913c553ac5604f40bf9a0a5d5ec6b75
  # Exact RC-published extension artifact. The Workspace init verifies the raw
  # VSIX SHA before installing it into the persistent IDE extensions directory.
  project-workspace-vsix-image-volume: 10.255.250.1:5000/researchcosmos/aicosmos-workspace-vsix@sha256:e7818c24ee8c29e5ad44180da6fa9877f9bda3bf342ad4ba2ac0138779a8a422
