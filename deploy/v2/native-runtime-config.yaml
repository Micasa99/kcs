  # without granting arbitrary runner egress.
  openai-base-url: https://ai-cosmos.cn/ai4sci/cosmos/model-gateway/openai/v1,https://ai-cosmos.cn/ai4sci-test/cosmos/model-gateway/openai/v1,https://ai-cosmos.cn/ai4sci-stable/cosmos/model-gateway/openai/v1,https://ai-cosmos.cn/ai4sci-local/cosmos/model-gateway/openai/v1
  anthropic-base-url: https://ai-cosmos.cn/ai4sci/cosmos/model-gateway/anthropic,https://ai-cosmos.cn/ai4sci-test/cosmos/model-gateway/anthropic,https://ai-cosmos.cn/ai4sci-stable/cosmos/model-gateway/anthropic,https://ai-cosmos.cn/ai4sci-local/cosmos/model-gateway/anthropic
