apiVersion: v1
kind: ConfigMap
metadata:
  name: kcs-alertmanager-config
  namespace: kcs-monitoring
data:
  alertmanager.yml: |
    route:
      receiver: kcs-ops-console
      group_by: [alertname, compute_node]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: kcs-ops-console
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kcs-alertmanager-data
  namespace: kcs-monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcs-alertmanager
  namespace: kcs-monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: kcs-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kcs-alertmanager
    spec:
      nodeSelector:
        researchcosmos.io/role: control
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alertmanager
          image: 10.255.250.1:5000/researchcosmos/alertmanager@sha256:6b02bb0d0a30a9b64062d54d6e47e1535de770048d2585a441de00f71b339caa
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - {name: http, containerPort: 9093}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: kcs-alertmanager-config}
        - name: data
          persistentVolumeClaim: {claimName: kcs-alertmanager-data}
---
apiVersion: v1
kind: Service
metadata:
  name: kcs-alertmanager
  namespace: kcs-monitoring
spec:
  selector:
    app.kubernetes.io/name: kcs-alertmanager
  ports:
    - {name: http, port: 9093, targetPort: http}
