# Replace 203.0.113.10/32 with the operator-owned Model Gateway VIP before apply.
# This file is intentionally separate from network-policy.yaml so a placeholder
# can never alter the hosted lane by accident.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kcs-v2-native-egress
  namespace: researchcosmos-v2
spec:
  podSelector:
    matchLabels:
      researchcosmos.io/managed-by: v2-attempt-runtime
      researchcosmos.io/runtime-lane: native
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - {protocol: TCP, port: 443}
