# Copy this file to the ignored config.runtime.yaml and replace every placeholder.
# Authentication comes only from KCS_V2_SERVICE_TOKEN; never put the token here.
api:
  baseUrl: https://kcs-v2.private.example.invalid:8443
  caFile: /path/to/untracked/kcs-v2-ca.pem
  image: registry.example.invalid/researchcosmos/kcs-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
  expectedVersion: "2.0.0"
  expectedOpenapiSha256: efcbb64fc1d96ec5f7797eda92405a4ae5c596b3a7864dad6396e423a09e193e

workloads:
  agentImage: registry.example.invalid/researchcosmos/kcs-conformance-agent@sha256:2222222222222222222222222222222222222222222222222222222222222222
  workspaceImage: registry.example.invalid/researchcosmos/kcs-conformance-workspace@sha256:3333333333333333333333333333333333333333333333333333333333333333
  runtimeUrl: https://researchcosmos-runtime.private.example.invalid
  nodeSelector:
    researchcosmos.io/pool: gpu
  sharedWorkspaceSizeGiB: 20

operator:
  checkpointDirectory: /path/to/untracked/operator-checkpoints

timeouts:
  requestSeconds: 30
  waitSeconds: 180
  pollSeconds: 2
  checkpointWaitSeconds: 900
