openapi: 3.1.0
info:
  title: KCS V2 Hosted Attempt API
  version: 2.2.0
  description: >-
    Canonical provider-runtime wire contract. KCS owns Kubernetes workload reality
    only, accepts opaque owner references, and never infers research success.
  x-kcs-features:
    transferModes: [direct]
    rangeRequests: false
    signedTransfers: false
  x-kcs-limits:
    refUtf8Bytes: 256
    environmentEntries: 32
    environmentKeyUtf8Bytes: 64
    environmentValueUtf8Bytes: 2048
    launchBundleBytes: 1048576
    credentialBytes: 65536
    operationStdoutBytes: 65536
    operationStderrBytes: 65536
    logsDefaultBytes: 65536
    logsMaximumBytes: 1048576
    directTransferBytes: 107374182400
    paginationDefault: 50
    paginationMaximum: 200
    tombstoneRetentionSeconds: 604800
    credentialTtlDefaultSeconds: 300
    credentialTtlMaximumSeconds: 900
x-kcs-legacy-authorization:
  v2NamespaceAccess: denied
  podsExec: denied
  secrets: denied
  mutations: denied
servers:
  - url: /
security:
  - v2ServiceBearer: []
x-kcs-network-boundary:
  tlsRequired: true
  privateIngressRequired: true
tags:
  - {name: Jobs}
  - {name: Credentials}
  - {name: Transfers}
  - {name: Workspace}
  - {name: Workspace terminal}
  - {name: Cluster observations}
  - {name: Contract}
paths:
  /api/v2/jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      x-kcs-service-authorization: v2-mutator
      x-kcs-error-codes:
        INVALID_REQUEST: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        IDENTITY_CONFLICT: {status: 409, recoveryAction: inspect_job}
        TOMBSTONED: {status: 410, recoveryAction: inspect_job}
        PAYLOAD_TOO_LARGE: {status: 413, recoveryAction: none}
        UNSUPPORTED_MEDIA_TYPE: {status: 415, recoveryAction: none}
        DIGEST_MISMATCH: {status: 422, recoveryAction: none}
        CAPACITY_LIMIT: {status: 429, recoveryAction: retry_same}
        RATE_LIMIT: {status: 429, recoveryAction: retry_same}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
        DEPENDENCY_TIMEOUT: {status: 504, recoveryAction: retry_same}
      x-kcs-digest-projection:
        kind: rfc8785-jcs
        identity: [{in: body, name: providerRequestId}]
        digest: specDigest
        digestLocation: body
        projection: {source: requestBody, field: spec}
      x-kcs-replay:
        newStatus: 201
        replayStatus: 200
        conflictStatus: 409
        conflictCode: IDENTITY_CONFLICT
        recoveryAction: inspect_job
      x-kcs-unknown-outcome-recovery:
        operationId: listJobs
        method: GET
        path: /api/v2/jobs
        query:
          providerRequestId: '$request.body#/providerRequestId'
          includeDeleted: true
        combinedCollections: [items, tombstones]
        maximumMatches: 1
        compareDigest: {responseField: specDigest, requestField: specDigest}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateJobRequest'}
      responses:
        '201': &JobCreated
          description: New provider binding created.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobBindingSnapshot'}}}
        '200': &JobReplay
          description: Stable same-identity, same-digest replay.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobBindingSnapshot'}}}
        '400': &Error400
          description: Malformed or invalid request.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '401': &Error401
          description: Missing or invalid V2 service authentication.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '403': &Error403
          description: Caller lacks the operation authorization role.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '409': &Error409
          description: Stable identity, digest, binding, or state conflict.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '410':
          description: Retained tombstone prevents recreation.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413': &Error413
          description: Payload exceeds a frozen limit.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '415': &Error415
          description: Unsupported media type.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '422': &Error422
          description: Semantically invalid request or byte mismatch.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '429': &Error429
          description: Capacity or rate limit reached.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '500': &Error500
          description: Sanitized internal failure.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '503': &Error503
          description: Required dependency unavailable.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '504': &Error504
          description: Required dependency timed out.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    get:
      tags: [Jobs]
      operationId: listJobs
      x-kcs-service-authorization: v2-reader
      x-kcs-error-codes:
        INVALID_REQUEST: {status: 400, recoveryAction: none}
        INVALID_PAGE_TOKEN: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        STALE_PAGE_TOKEN: {status: 409, recoveryAction: none}
        CAPACITY_LIMIT: {status: 429, recoveryAction: retry_same}
        RATE_LIMIT: {status: 429, recoveryAction: retry_same}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      x-kcs-ordering:
        strategy: stable-key-merge
        collections: [items, tombstones]
        keys: [createdAt, jobRef]
        uniqueIdentities: [jobRef, providerRequestId, jobUid]
      x-kcs-page-token-binding: [namespace, providerRequestId, subjectRef, state, createdAfter, includeDeleted]
      parameters:
        - {$ref: '#/components/parameters/PageToken'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/ProviderRequestIdFilter'}
        - {$ref: '#/components/parameters/SubjectRefFilter'}
        - {$ref: '#/components/parameters/StateFilter'}
        - {$ref: '#/components/parameters/CreatedAfterFilter'}
        - {$ref: '#/components/parameters/IncludeDeletedFilter'}
      responses:
        '200':
          description: Deterministically ordered live bindings and requested tombstones.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobBindingSnapshotList'}}}
        '400': *Error400
        '401': *Error401
        '403': *Error403
        '409': *Error409
        '429': *Error429
        '500': *Error500
        '503': *Error503
  /api/v2/jobs/{jobRef}:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
    get:
      tags: [Jobs]
      operationId: inspectJob
      x-kcs-service-authorization: v2-reader
      x-kcs-error-codes:
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        TOMBSTONED: {status: 410, recoveryAction: inspect_job}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      responses:
        '200':
          description: Current immutable binding and observed provider reality.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobBindingSnapshot'}}}
        '401': *Error401
        '403': *Error403
        '404': &Error404
          description: Resource is unknown after retention.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '410':
          description: Retained tombstone is the authoritative terminal record.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '500': *Error500
        '503': *Error503
    delete:
      tags: [Jobs]
      operationId: deleteJob
      x-kcs-service-authorization: v2-mutator
      x-kcs-error-codes:
        INVALID_REQUEST: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        IDENTITY_CONFLICT: {status: 409, recoveryAction: inspect_job}
        STATE_CONFLICT: {status: 409, recoveryAction: inspect_job}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        DIGEST_MISMATCH: {status: 422, recoveryAction: none}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
        DEPENDENCY_TIMEOUT: {status: 504, recoveryAction: retry_same}
      x-kcs-digest-projection:
        kind: rfc8785-jcs-empty-object
        identity:
          - {in: path, name: jobRef}
          - {in: header, name: KCS-Delete-Ref}
        digest: requestDigest
        digestLocation: header
        projection: {source: constant, value: {}}
      x-kcs-replay:
        newStatus: 200
        replayStatus: 200
        conflictStatus: 409
        conflictCode: IDENTITY_CONFLICT
        recoveryAction: inspect_job
      parameters:
        - {$ref: '#/components/parameters/DeleteRefHeader'}
        - {$ref: '#/components/parameters/RequestDigestHeader'}
      responses:
        '200':
          description: Workload reality removed and seven-day tombstone retained.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobTombstone'}}}
        '400': *Error400
        '401': *Error401
        '403': *Error403
        '404': *Error404
        '409': *Error409
        '422': *Error422
        '500': *Error500
        '503': *Error503
        '504': *Error504
  /api/v2/jobs/{jobRef}/logs:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
    get:
      tags: [Jobs]
      operationId: getRoleLogs
      x-kcs-service-authorization: v2-reader
      x-kcs-error-codes:
        INVALID_CURSOR: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        STALE_CURSOR: {status: 409, recoveryAction: inspect_job}
        TOMBSTONED: {status: 410, recoveryAction: inspect_job}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      x-kcs-cursor-binding: [namespace, jobRef, podUid, container]
      parameters:
        - {$ref: '#/components/parameters/Container'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/LogLimit'}
      responses:
        '200':
          description: One bounded continuation of the actual combined Kubernetes container log.
          content: {application/json: {schema: {$ref: '#/components/schemas/RoleLogs'}}}
        '400': *Error400
        '401': *Error401
        '403': *Error403
        '404': *Error404
        '409': *Error409
        '410':
          description: Requested log identity is gone.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '500': *Error500
        '503': *Error503
  /api/v2/jobs/{jobRef}/telemetry/nvidia:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
    get:
      tags: [Cluster observations]
      operationId: getNvidiaTelemetry
      x-kcs-service-authorization: v2-reader
      x-kcs-cache-control: no-store
      x-kcs-error-codes:
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        STATE_CONFLICT: {status: 409, recoveryAction: inspect_job}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        TOMBSTONED: {status: 410, recoveryAction: inspect_job}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
        DEPENDENCY_TIMEOUT: {status: 504, recoveryAction: retry_same}
      responses:
        '200':
          description: Fresh NVIDIA driver observations from the exact bound Workspace Pod.
          x-kcs-required-headers: [Cache-Control]
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/NvidiaTelemetrySnapshot'}}}
        '401': &NoStoreError
          description: Sanitized no-store route error; sensitive bytes are not returned.
          x-kcs-required-headers: [Cache-Control]
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '403': *NoStoreError
        '404': *NoStoreError
        '409': *NoStoreError
        '410': *NoStoreError
        '500': *NoStoreError
        '503': *NoStoreError
        '504': *NoStoreError
  /api/v2/jobs/{jobRef}/agent/credential-grants:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
    post:
      tags: [Credentials]
      operationId: grantCredential
      x-kcs-service-authorization: v2-private-credential-writer
      x-kcs-private-ingress: true
      x-kcs-request-body-logging: forbidden
      x-kcs-no-request-body-log: true
      x-kcs-cache-control: no-store
      x-kcs-redact-headers: [Authorization, KCS-Credential-SHA256, KCS-Grant-Metadata-Digest]
      x-kcs-rbac-boundary: v2-namespace-only
      x-kcs-legacy-proxy-access: denied
      x-kcs-error-codes:
        INVALID_REQUEST: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        IDENTITY_CONFLICT: {status: 409, recoveryAction: inspect_grant}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        REPLACEMENT_POD: {status: 409, recoveryAction: reattach}
        CREDENTIAL_ACTIVE: {status: 409, recoveryAction: inspect_grant}
        PAYLOAD_TOO_LARGE: {status: 413, recoveryAction: none}
        UNSUPPORTED_MEDIA_TYPE: {status: 415, recoveryAction: none}
        DIGEST_MISMATCH: {status: 422, recoveryAction: none}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      x-kcs-digest-projection:
        kind: raw-body
        identity:
          - {in: path, name: jobRef}
          - {in: header, name: KCS-Credential-Grant-Ref}
        digest: credentialSha256
        digestLocation: header
        projection: {source: requestBody, encoding: raw-bytes}
        metadataDigest:
          field: grantMetadataDigest
          kind: rfc8785-jcs
          digestLocation: header
          projection:
            - {field: agentRunRef, header: KCS-Agent-Run-Ref}
            - {field: generation, header: KCS-Generation}
            - {field: launchBundleDigest, header: KCS-Launch-Bundle-Digest}
            - {field: audience, header: KCS-Audience}
            - {field: credentialSha256, header: KCS-Credential-SHA256}
            - {field: ttlSeconds, header: KCS-Credential-TTL-Seconds}
            - {field: jobUid, header: KCS-Job-UID}
            - {field: podUid, header: KCS-Pod-UID}
      x-kcs-replay:
        newStatus: 201
        replayStatus: 200
        conflictStatus: 409
        conflictCode: IDENTITY_CONFLICT
        recoveryAction: inspect_grant
      parameters:
        - {$ref: '#/components/parameters/CredentialGrantRefHeader'}
        - {$ref: '#/components/parameters/CredentialSha256Header'}
        - {$ref: '#/components/parameters/GrantMetadataDigestHeader'}
        - {$ref: '#/components/parameters/AgentRunRefHeader'}
        - {$ref: '#/components/parameters/GenerationHeader'}
        - {$ref: '#/components/parameters/LaunchBundleDigestHeader'}
        - {$ref: '#/components/parameters/AudienceHeader'}
        - {$ref: '#/components/parameters/JobUidHeader'}
        - {$ref: '#/components/parameters/PodUidHeader'}
        - {$ref: '#/components/parameters/CredentialTtlHeader'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 65536, x-kcs-maxBytes: 65536}
      responses:
        '201': &GrantCreated
          description: New bound credential grant accepted.
          x-kcs-required-headers: [Cache-Control]
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CredentialGrantSnapshot'}}}
        '200': &GrantReplay
          description: Stable grant replay or cleanup retry without replacement Secret.
          x-kcs-required-headers: [Cache-Control]
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CredentialGrantSnapshot'}}}
        '400': *NoStoreError
        '401': *NoStoreError
        '403': *NoStoreError
        '404': *NoStoreError
        '409': *NoStoreError
        '413': *NoStoreError
        '415': *NoStoreError
        '422': *NoStoreError
        '500': *NoStoreError
        '503': *NoStoreError
  /api/v2/jobs/{jobRef}/agent/credential-grants/{credentialGrantRef}:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
      - {$ref: '#/components/parameters/CredentialGrantRef'}
    get:
      tags: [Credentials]
      operationId: inspectCredentialGrant
      x-kcs-service-authorization: v2-reader
      x-kcs-cache-control: no-store
      x-kcs-error-codes:
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      responses:
        '200':
          description: Non-secret grant lifecycle and destruction observation.
          x-kcs-required-headers: [Cache-Control]
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CredentialGrantSnapshot'}}}
        '401': *NoStoreError
        '403': *NoStoreError
        '404': *NoStoreError
        '409': *NoStoreError
        '500': *NoStoreError
        '503': *NoStoreError
  /api/v2/jobs/{jobRef}/agent/start:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
    post:
      tags: [Jobs]
      operationId: startAgent
      x-kcs-service-authorization: v2-mutator
      x-kcs-error-codes:
        INVALID_REQUEST: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        IDENTITY_CONFLICT: {status: 409, recoveryAction: inspect_job}
        STATE_CONFLICT: {status: 409, recoveryAction: inspect_job}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        REPLACEMENT_POD: {status: 409, recoveryAction: reattach}
        ILLEGAL_GENERATION: {status: 409, recoveryAction: inspect_job}
        CREDENTIAL_EXPIRED: {status: 409, recoveryAction: inspect_grant}
        PAYLOAD_TOO_LARGE: {status: 413, recoveryAction: none}
        UNSUPPORTED_MEDIA_TYPE: {status: 415, recoveryAction: none}
        DIGEST_MISMATCH: {status: 422, recoveryAction: none}
        PRECONDITION_FAILED: {status: 422, recoveryAction: inspect_job}
        CREDENTIAL_DESTROY_FAILED: {status: 500, recoveryAction: reconcile}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
        DEPENDENCY_TIMEOUT: {status: 504, recoveryAction: retry_same}
      x-kcs-digest-projection:
        kind: rfc8785-jcs
        identity:
          - {in: path, name: jobRef}
          - {in: body, name: generation}
        digest: startMetadataDigest
        digestLocation: response
        projection: {source: requestBody, exclude: [generation]}
      x-kcs-replay:
        newStatus: 202
        replayStatus: 200
        conflictStatus: 409
        conflictCode: IDENTITY_CONFLICT
        recoveryAction: inspect_job
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentStartRequest'}
      responses:
        '202': &StartAccepted
          description: New generation accepted by the bound live supervisor.
          content: {application/json: {schema: {$ref: '#/components/schemas/GenerationSnapshot'}}}
        '200': &StartReplay
          description: Stable same-generation, same-metadata replay.
          content: {application/json: {schema: {$ref: '#/components/schemas/GenerationSnapshot'}}}
        '400': *Error400
        '401': *Error401
        '403': *Error403
        '404': *Error404
        '409': *Error409
        '413': *Error413
        '415': *Error415
        '422': *Error422
        '500': *Error500
        '503': *Error503
        '504': *Error504
  /api/v2/jobs/{jobRef}/transfers:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
    post:
      tags: [Transfers]
      operationId: registerTransfer
      x-kcs-service-authorization: v2-mutator
      x-kcs-error-codes:
        INVALID_REQUEST: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        IDENTITY_CONFLICT: {status: 409, recoveryAction: inspect_transfer}
        STATE_CONFLICT: {status: 409, recoveryAction: inspect_transfer}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        REPLACEMENT_POD: {status: 409, recoveryAction: reattach}
        OVERWRITE_FORBIDDEN: {status: 409, recoveryAction: inspect_transfer}
        PAYLOAD_TOO_LARGE: {status: 413, recoveryAction: none}
        UNSUPPORTED_MEDIA_TYPE: {status: 415, recoveryAction: none}
        DIGEST_MISMATCH: {status: 422, recoveryAction: none}
        PRECONDITION_FAILED: {status: 422, recoveryAction: inspect_transfer}
        UNSAFE_PATH: {status: 422, recoveryAction: none}
        CAPACITY_LIMIT: {status: 429, recoveryAction: retry_same}
        RATE_LIMIT: {status: 429, recoveryAction: retry_same}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      x-kcs-digest-projection:
        kind: rfc8785-jcs
        identity:
          - {in: path, name: jobRef}
          - {in: body, name: transferRef}
        digest: requestDigest
        digestLocation: body
        projection: {source: requestBody, field: spec}
      x-kcs-replay:
        newStatus: 201
        replayStatus: 200
        conflictStatus: 409
        conflictCode: IDENTITY_CONFLICT
        recoveryAction: inspect_transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferRegisterRequest'}
      responses:
        '201': &TransferCreated
          description: New direct transfer registered.
          content: {application/json: {schema: {$ref: '#/components/schemas/TransferSnapshot'}}}
        '200': &TransferReplay
          description: Stable same-transfer, same-spec replay.
          content: {application/json: {schema: {$ref: '#/components/schemas/TransferSnapshot'}}}
        '400': *Error400
        '401': *Error401
        '403': *Error403
        '404': *Error404
        '409': *Error409
        '413': *Error413
        '415': *Error415
        '422': *Error422
        '429': *Error429
        '500': *Error500
        '503': *Error503
  /api/v2/jobs/{jobRef}/transfers/{transferRef}:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
      - {$ref: '#/components/parameters/TransferRef'}
    get:
      tags: [Transfers]
      operationId: inspectTransfer
      x-kcs-service-authorization: v2-reader
      x-kcs-error-codes:
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        GONE: {status: 410, recoveryAction: none}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
