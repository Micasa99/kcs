      required: [cancelRef, requestDigest, spec]
      properties:
        cancelRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/TransferCancelSpec'}
    TransferSnapshot:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [state]
            properties: {state: {const: registered}}
          then:
            properties:
              actualSizeBytes: {type: 'null'}
              actualSha256: {type: 'null'}
              verified: {const: false}
              contentAvailable: {const: false}
              snapshotRef: {type: 'null'}
              completedAt: {type: 'null'}
              failureReason: {type: 'null'}
        - if:
            required: [state]
            properties: {state: {const: completed}}
          then:
            properties:
              actualSizeBytes: {type: integer, minimum: 0, maximum: 107374182400}
              actualSha256: {$ref: '#/components/schemas/Sha256'}
              verified: {const: true}
              contentAvailable: {const: true}
              completedAt: {$ref: '#/components/schemas/Timestamp'}
              failureReason: {type: 'null'}
        - if:
            required: [state]
            properties: {state: {enum: [canceled, discarded]}}
          then:
            properties:
              completedAt: {$ref: '#/components/schemas/Timestamp'}
        - if:
            required: [state]
            properties: {state: {const: canceled}}
          then:
            properties:
              cancelAction:
                properties: {state: {const: succeeded}}
        - if:
            required: [state]
            properties: {state: {const: discarded}}
          then:
            properties:
              discardAction:
                properties: {state: {const: succeeded}}
        - if:
            required: [state]
            properties: {state: {const: failed}}
          then:
            properties:
              completedAt: {$ref: '#/components/schemas/Timestamp'}
              failureReason: {type: string, minLength: 1}
      required: [transferRef, requestDigest, jobRef, jobUid, podUid, spec, state, actualSizeBytes, actualSha256, verified, contentAvailable, snapshotRef, createdAt, updatedAt, completedAt, observedAt, failureReason, cancelAction, discardAction]
      properties:
        transferRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        spec: {$ref: '#/components/schemas/TransferSpec'}
        state: {$ref: '#/components/schemas/TransferState'}
        actualSizeBytes:
          oneOf: [{type: integer, minimum: 0, maximum: 107374182400}, {type: 'null'}]
        actualSha256: {$ref: '#/components/schemas/NullableSha256'}
        verified: {type: boolean}
        contentAvailable: {type: boolean}
        snapshotRef: {$ref: '#/components/schemas/NullableOpaqueRef'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
        completedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        failureReason: {$ref: '#/components/schemas/NullableString'}
        cancelAction: {$ref: '#/components/schemas/ActionSnapshot'}
        discardAction: {$ref: '#/components/schemas/ActionSnapshot'}
    WorkspaceFrame:
      type: object
      required: [protocol]
      properties:
        protocol: {type: string, const: cosmos.workspace/1}
      additionalProperties: true
      x-kcs-forward-unchanged: true
      x-kcs-maxCanonicalBytes: 1048576
    WorkspaceOperationSnapshot:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [state]
            properties: {state: {const: succeeded}}
          then:
            properties:
              finishedAt: {$ref: '#/components/schemas/Timestamp'}
              exitCode: {const: 0}
      x-kcs-inline-result-relation:
        canonicalization: rfc8785-jcs
        value: inlineResult
        size: inlineResultSize
        digest: inlineResultDigest
        exclusiveWith: resultTransferRef
      required: [jobRef, operationRef, requestDigest, storedFrameDigest, binding, state, exitCode, stdout, stderr, stdoutTruncated, stderrTruncated, inlineResultSize, inlineResultDigest, inlineResult, resultTransferRef, acceptedAt, startedAt, finishedAt, observedAt, failureReason]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        operationRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        storedFrameDigest: {$ref: '#/components/schemas/Sha256'}
        binding: {$ref: '#/components/schemas/BindingIdentity'}
        state: {$ref: '#/components/schemas/OperationState'}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        stdout: {type: string, maxLength: 65536, x-kcs-maxUtf8Bytes: 65536}
        stderr: {type: string, maxLength: 65536, x-kcs-maxUtf8Bytes: 65536}
        stdoutTruncated: {type: boolean}
        stderrTruncated: {type: boolean}
        inlineResultSize:
          oneOf: [{type: integer, minimum: 0, maximum: 65536}, {type: 'null'}]
        inlineResultDigest: {$ref: '#/components/schemas/NullableSha256'}
        inlineResult:
          oneOf: [{type: object, x-kcs-maxCanonicalBytes: 65536}, {type: 'null'}]
        resultTransferRef: {$ref: '#/components/schemas/NullableOpaqueRef'}
        acceptedAt: {$ref: '#/components/schemas/Timestamp'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        finishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        failureReason: {$ref: '#/components/schemas/NullableString'}
    FinalizeSpec:
      type: object
      additionalProperties: false
      required: [operationRefs, transferRefs, drainTimeoutSeconds]
      properties:
        operationRefs: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueRef'}}
        transferRefs: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueRef'}}
        drainTimeoutSeconds: {type: integer, minimum: 1, maximum: 86400}
    FinalizeJobRequest:
      type: object
      additionalProperties: false
      required: [finalizeRef, requestDigest, spec]
      properties:
        finalizeRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/FinalizeSpec'}
    NativeCaptureState: {type: string, enum: [complete, failed, indeterminate]}
    NativeCaptureBarrier:
      type: object
      additionalProperties: false
      required: [captureRef, captureReceiptDigest, captureFenceRef, state, failureReason, jobUid, podUid, generation, runnerObservationSequence, runnerObservationDigest, capturedTransferRefs, observedAt]
      properties:
        captureRef: {$ref: '#/components/schemas/OpaqueRef'}
        captureReceiptDigest: {$ref: '#/components/schemas/Sha256'}
        captureFenceRef: {$ref: '#/components/schemas/OpaqueRef'}
        state: {$ref: '#/components/schemas/NativeCaptureState'}
        failureReason: {$ref: '#/components/schemas/NullableString'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        generation: {type: integer, minimum: 1}
        runnerObservationSequence: {type: integer, minimum: 1}
        runnerObservationDigest: {$ref: '#/components/schemas/Sha256'}
        capturedTransferRefs:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/OpaqueRef'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    NativeFinalizeSpec:
      type: object
      additionalProperties: false
      required: [operationRefs, transferRefs, drainTimeoutSeconds, captureBarrier]
      properties:
        operationRefs: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueRef'}}
        transferRefs: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueRef'}}
        drainTimeoutSeconds: {type: integer, minimum: 1, maximum: 86400}
        captureBarrier: {$ref: '#/components/schemas/NativeCaptureBarrier'}
    NativeFinalizeJobRequest:
      type: object
      additionalProperties: false
      required: [finalizeRef, requestDigest, spec]
      properties:
        finalizeRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/NativeFinalizeSpec'}
    AnyFinalizeJobRequest:
      oneOf:
        - {$ref: '#/components/schemas/FinalizeJobRequest'}
        - {$ref: '#/components/schemas/NativeFinalizeJobRequest'}
    CancelSpec:
      type: object
      additionalProperties: false
      required: [finishCollectTransferRefs]
      properties:
        finishCollectTransferRefs: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueRef'}}
        reason: {$ref: '#/components/schemas/OpaqueRef'}
    CancelJobRequest:
      type: object
      additionalProperties: false
      required: [cancelRef, requestDigest, spec]
      properties:
        cancelRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/CancelSpec'}
    JobTombstone:
      type: object
      additionalProperties: false
      x-kcs-time-ordering: [createdAt, deletedAt, expiresAt]
      required: [providerRequestId, specDigest, jobRef, jobUid, podUid, state, finalState, deleteRef, deleteRequestDigest, createdAt, cleanup, gpuRelease, credentialObservations, transferObservations, deletedAt, expiresAt]
      properties:
        providerRequestId: {$ref: '#/components/schemas/OpaqueRef'}
        specDigest: {$ref: '#/components/schemas/Sha256'}
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid:
          oneOf: [{$ref: '#/components/schemas/KubernetesUid'}, {type: 'null'}]
        state: {type: string, const: deleted}
        finalState: {$ref: '#/components/schemas/ProviderTerminalState'}
        deleteRef: {$ref: '#/components/schemas/OpaqueRef'}
        deleteRequestDigest: {$ref: '#/components/schemas/Sha256'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        cleanup: {$ref: '#/components/schemas/CleanupObservation'}
        gpuRelease: {$ref: '#/components/schemas/CleanupObservation'}
        credentialObservations: {type: array, items: {$ref: '#/components/schemas/CredentialObservation'}}
        transferObservations: {type: array, items: {$ref: '#/components/schemas/TransferObservation'}}
        deletedAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    ErrorCode:
      type: string
      enum: [INVALID_REQUEST, INVALID_CURSOR, STALE_CURSOR, INVALID_PAGE_TOKEN, STALE_PAGE_TOKEN, UNAUTHENTICATED, FORBIDDEN, DIGEST_MISMATCH, IDENTITY_CONFLICT, STATE_CONFLICT, PRECONDITION_FAILED, STALE_BINDING, REPLACEMENT_POD, TERMINAL_BUSY, TERMINAL_CREDENTIAL_INVALID, TOMBSTONED, NOT_FOUND, GONE, ILLEGAL_GENERATION, CREDENTIAL_ACTIVE, CREDENTIAL_EXPIRED, CREDENTIAL_DESTROY_FAILED, UNSAFE_PATH, OVERWRITE_FORBIDDEN, TRANSFER_BYTES_MISMATCH, TRANSFER_INDETERMINATE, OPERATION_INDETERMINATE, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, CAPACITY_LIMIT, RATE_LIMIT, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, INTERNAL_ERROR]
    RecoveryAction:
      type: string
      enum: [retry_same, inspect_job, inspect_grant, inspect_runner_credential_grant, inspect_transfer, inspect_operation, inspect_terminal, reattach, reconcile, new_attempt, none]
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: {type: string}
        reason: {type: string}
    ErrorContext:
      type: object
      additionalProperties: false
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
        transferRef: {$ref: '#/components/schemas/OpaqueRef'}
        operationRef: {$ref: '#/components/schemas/OpaqueRef'}
        tombstone: {$ref: '#/components/schemas/JobTombstone'}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, recoveryAction, requestId]
          allOf:
            - if:
                required: [code]
                properties:
                  code: {const: TOMBSTONED}
              then:
                required: [context]
                properties:
                  retryable: {const: false}
                  recoveryAction: {const: inspect_job}
                  context:
                    required: [tombstone]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message: {type: string, minLength: 1}
            retryable: {type: boolean}
            recoveryAction: {$ref: '#/components/schemas/RecoveryAction'}
            requestId: {$ref: '#/components/schemas/OpaqueRef'}
            details: {type: array, items: {$ref: '#/components/schemas/ErrorDetail'}}
            context: {$ref: '#/components/schemas/ErrorContext'}
    OpenApiDocument:
      type: object
      additionalProperties: true
      required: [openapi, info, paths]
      properties:
        openapi: {type: string, const: 3.1.0}
        info: {type: object}
        paths: {type: object}
