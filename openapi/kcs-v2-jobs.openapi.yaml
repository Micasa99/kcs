components:
  securitySchemes:
    v2ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
      description: >-
        Fail-closed KCS_V2_SERVICE_TOKEN over TLS; credential bytes are further
        restricted to the private ingress and credential-writer authorization role.
  parameters:
    JobRef: {name: jobRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    CredentialGrantRef: {name: credentialGrantRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TransferRef: {name: transferRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    OperationRef: {name: operationRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    Container: {name: container, in: query, required: true, schema: {type: string, enum: [agent, workspace]}}
    AnyContainer: {name: container, in: query, required: true, schema: {type: string, enum: [agent, workspace, runner, control]}}
    Cursor: {name: cursor, in: query, schema: {$ref: '#/components/schemas/OpaqueCursor'}}
    EventCursor: {name: cursor, in: query, schema: {$ref: '#/components/schemas/OpaqueCursor'}}
    EventLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 200}}
    LogLimit: {name: limitBytes, in: query, schema: {type: integer, minimum: 1, maximum: 1048576, default: 65536}}
    PageToken: {name: pageToken, in: query, schema: {$ref: '#/components/schemas/OpaquePageToken'}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    ProviderRequestIdFilter: {name: providerRequestId, in: query, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    SubjectRefFilter: {name: subjectRef, in: query, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    StateFilter:
      name: state
      in: query
      style: form
      explode: true
      schema: {type: array, items: {$ref: '#/components/schemas/JobBindingState'}}
    CreatedAfterFilter: {name: createdAfter, in: query, schema: {$ref: '#/components/schemas/Timestamp'}}
    IncludeDeletedFilter: {name: includeDeleted, in: query, schema: {type: boolean, default: false}}
    DeleteRefHeader: {name: KCS-Delete-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    DiscardRefHeader: {name: KCS-Discard-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    RequestDigestHeader: {name: KCS-Request-Digest, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    CredentialGrantRefHeader: {name: KCS-Credential-Grant-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    CredentialSha256Header: {name: KCS-Credential-SHA256, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    GrantMetadataDigestHeader: {name: KCS-Grant-Metadata-Digest, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    AgentRunRefHeader: {name: KCS-Agent-Run-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    GenerationHeader: {name: KCS-Generation, in: header, required: true, schema: {type: integer, minimum: 1}}
    LaunchBundleDigestHeader: {name: KCS-Launch-Bundle-Digest, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    NativeLaunchDigestHeader: {name: KCS-Native-Launch-Digest, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    RunnerCredentialKindHeader: {name: KCS-Credential-Kind, in: header, required: true, schema: {type: string, const: modelGatewayToken}}
    ProjectionTtlHeader:
      name: KCS-Projection-TTL-Seconds
      in: header
      required: true
      description: >-
        KCS Secret-projection lease. Minimum 120 seconds covers observed kubelet
        projection jitter; this is distinct from opaque gateway-token claim expiry.
      schema: {type: integer, minimum: 120, maximum: 900}
    AudienceHeader: {name: KCS-Audience, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    JobUidHeader: {name: KCS-Job-UID, in: header, required: true, schema: {$ref: '#/components/schemas/KubernetesUid'}}
    PodUidHeader: {name: KCS-Pod-UID, in: header, required: true, schema: {$ref: '#/components/schemas/KubernetesUid'}}
    CredentialTtlHeader: {name: KCS-Credential-TTL-Seconds, in: header, required: true, schema: {type: integer, minimum: 1, maximum: 900}}
    ContentSha256Header: {name: KCS-Content-SHA256, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    ContentLengthHeader: {name: Content-Length, in: header, required: true, schema: {type: integer, minimum: 0, maximum: 107374182400}}
    OperationRefHeader: {name: KCS-Operation-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TerminalRef: {name: terminalRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TerminalSubject: {name: KCS-Subject-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TerminalCredential: {name: KCS-Terminal-Credential, in: header, required: true, schema: {type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}}
  headers:
    NoStore: {schema: {type: string, const: no-store}}
    TerminalCredential: {schema: {type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}}
  responses:
    BadRequest: *Error400
    Unauthorized: *Error401
    Forbidden: *Error403
    NotFound: *Error404
    Conflict: *Error409
    Gone:
      description: Resource is no longer retained.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    TooLarge: *Error413
    UnsupportedMediaType: *Error415
    Unprocessable: *Error422
    TooManyRequests: *Error429
    InternalError: *Error500
    Unavailable: *Error503
    Timeout: *Error504
  schemas:
    OpaqueRef:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[^\u0000-\u001f\u007f]+$'
      x-kcs-maxUtf8Bytes: 256
    OpaqueCursor:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: '^[A-Za-z0-9_-]+$'
      format: kcs-base64url
      x-kcs-maxUtf8Bytes: 4096
      description: Opaque base64url cursor bound to namespace, job, immutable Pod UID, and role.
    OpaquePageToken:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: '^[A-Za-z0-9_-]+$'
      format: kcs-base64url
      x-kcs-maxUtf8Bytes: 4096
      description: Opaque base64url token bound to namespace and the complete filter set.
    Sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    KubernetesUid: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    NullableTimestamp:
      oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
    NullableString:
      oneOf: [{type: string}, {type: 'null'}]
    NullableInteger:
      oneOf: [{type: integer}, {type: 'null'}]
    NullableBoolean:
      oneOf: [{type: boolean}, {type: 'null'}]
    NullableOpaqueRef:
      oneOf: [{$ref: '#/components/schemas/OpaqueRef'}, {type: 'null'}]
    NullableSha256:
      oneOf: [{$ref: '#/components/schemas/Sha256'}, {type: 'null'}]
    Environment:
      type: object
      maxProperties: 32
      propertyNames:
        type: string
        maxLength: 64
        pattern: '^(LANG|LC_ALL|TZ|HTTP_PROXY|HTTPS_PROXY|NO_PROXY|RC_PUBLIC_RUNTIME_BASE_URL)$'
        x-kcs-maxUtf8Bytes: 64
      additionalProperties:
        type: string
        maxLength: 2048
        x-kcs-maxUtf8Bytes: 2048
        format: kcs-non-secret-runtime-value
      x-kcs-secret-value-policy: reject-secret-shaped-values
    NodeSelector:
      type: object
      additionalProperties: false
      required: [researchcosmos.io/pool]
      properties:
        researchcosmos.io/pool: {type: string, const: gpu}
    QueueReason:
      type: string
      enum: [unschedulable, image_pull, quota, provisioning, unknown]
    GpuCapacitySnapshot:
      type: object
      additionalProperties: false
      required: [kind, capacity, allocatable, requestedByManagedJobs]
      properties:
        kind: {type: string, const: nvidia.com/gpu}
        capacity: {type: integer, minimum: 0}
        allocatable: {type: integer, minimum: 0}
        requestedByManagedJobs: {type: integer, minimum: 0}
    CpuCapacitySnapshot:
      type: object
      additionalProperties: false
      required: [capacityMilli, allocatableMilli, requestedByManagedJobsMilli]
      properties:
        capacityMilli: {type: integer, minimum: 0}
        allocatableMilli: {type: integer, minimum: 0}
        requestedByManagedJobsMilli: {type: integer, minimum: 0}
    MemoryCapacitySnapshot:
      type: object
      additionalProperties: false
      required: [capacityBytes, allocatableBytes, requestedByManagedJobsBytes]
      properties:
        capacityBytes: {type: integer, minimum: 0}
        allocatableBytes: {type: integer, minimum: 0}
        requestedByManagedJobsBytes: {type: integer, minimum: 0}
    CapacityNodeSnapshot:
      type: object
      additionalProperties: false
      required: [displayComputeNode, pool, ready, conditions, gpu, cpu, memory, managedJobCount]
      properties:
        displayComputeNode: {type: string, minLength: 1, maxLength: 128}
        pool: {type: string, minLength: 1, maxLength: 128}
        ready: {type: boolean}
        conditions:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        gpu: {$ref: '#/components/schemas/GpuCapacitySnapshot'}
        cpu: {$ref: '#/components/schemas/CpuCapacitySnapshot'}
        memory: {$ref: '#/components/schemas/MemoryCapacitySnapshot'}
        managedJobCount: {type: integer, minimum: 0}
    CapacitySnapshot:
      type: object
      additionalProperties: false
      required: [observedAt, nodes]
      properties:
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/CapacityNodeSnapshot'}
    QueueRequestedResources:
      type: object
      additionalProperties: false
      required: [gpu, cpuMilli, memoryBytes]
      properties:
        gpu: {type: integer, minimum: 0}
        cpuMilli: {type: integer, minimum: 0}
        memoryBytes: {type: integer, minimum: 0}
    PendingJobSnapshot:
      type: object
      additionalProperties: false
      required: [jobRef, subjectRef, createdAt, reason, message, requested]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        reason: {$ref: '#/components/schemas/QueueReason'}
        message: {type: string, maxLength: 512, x-kcs-maxUtf8Bytes: 512}
        requested: {$ref: '#/components/schemas/QueueRequestedResources'}
    QueueSnapshot:
      type: object
      additionalProperties: false
      required: [observedAt, pending]
      properties:
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        pending:
          type: array
          items: {$ref: '#/components/schemas/PendingJobSnapshot'}
    NvidiaDeviceTelemetry:
      type: object
      additionalProperties: false
      required: [deviceId, utilizationPercent, memoryUsedMiB, memoryTotalMiB, temperatureCelsius]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 128}
        utilizationPercent: {type: integer, minimum: 0, maximum: 100}
        memoryUsedMiB: {type: integer, minimum: 0}
        memoryTotalMiB: {type: integer, minimum: 1}
        temperatureCelsius: {type: integer, minimum: -100, maximum: 250}
    NvidiaTelemetrySnapshot:
      type: object
      additionalProperties: false
      required: [jobRef, jobUid, podUid, computeNode, observedAt, devices]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        computeNode: {type: string, minLength: 1, maxLength: 128}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        devices: {type: array, minItems: 1, items: {$ref: '#/components/schemas/NvidiaDeviceTelemetry'}}
    NodeCpuTelemetry:
      type: object
      additionalProperties: false
      required: [utilizationPercent]
      properties:
        utilizationPercent: {type: number, minimum: 0, maximum: 100}
    NodeMemoryTelemetry:
      type: object
      additionalProperties: false
      required: [usedBytes, totalBytes]
      properties:
        usedBytes: {type: integer, minimum: 0}
        totalBytes: {type: integer, minimum: 1}
    ClusterGpuTelemetry:
      type: object
      additionalProperties: false
      required: [deviceId, podRef]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 128}
        utilizationPercent: {type: number, minimum: 0, maximum: 100}
        memoryUsedMiB: {type: integer, minimum: 0}
        memoryTotalMiB: {type: integer, minimum: 1}
        temperatureCelsius: {type: number, minimum: -100, maximum: 250}
        powerWatts: {type: number, minimum: 0}
        eccVolatileErrors: {type: integer, minimum: 0}
        xidLastCode: {type: integer, minimum: 0}
        podRef: {oneOf: [{$ref: '#/components/schemas/OpaqueRef'}, {type: 'null'}]}
    NodeTelemetrySnapshot:
      type: object
      additionalProperties: false
      required: [computeNode, gpus]
      properties:
        computeNode: {type: string, minLength: 1, maxLength: 128}
        cpu: {$ref: '#/components/schemas/NodeCpuTelemetry'}
        memory: {$ref: '#/components/schemas/NodeMemoryTelemetry'}
        gpus:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/ClusterGpuTelemetry'}
    NodeTelemetryList:
      type: object
      additionalProperties: false
      required: [observedAt, kcsNow, nodes]
      properties:
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        kcsNow: {$ref: '#/components/schemas/Timestamp'}
        nodes:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/NodeTelemetrySnapshot'}
    RuntimeEventKind:
      type: string
      enum: [job_phase, node_condition, image_pull, scheduling, oom, runner_phase]
    RunnerPhaseEventDetail:
      type: object
      additionalProperties: false
      required: [generation, state, sequence, stateDigest, stopCause, processExitKind, exitCode, signal, protocolTerminalObserved]
      properties:
        generation: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/NativeRunnerState'}
        sequence: {type: integer, minimum: 1}
        stateDigest: {$ref: '#/components/schemas/Sha256'}
        stopCause: {$ref: '#/components/schemas/RunnerStopCause'}
        processExitKind: {type: string, enum: [not_observed, exited, signaled]}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        signal: {$ref: '#/components/schemas/NullableInteger'}
        protocolTerminalObserved: {type: boolean}
    RuntimeEvent:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [kind]
            properties: {kind: {const: runner_phase}}
          then:
            properties:
              detail: {$ref: '#/components/schemas/RunnerPhaseEventDetail'}
      required: [sequence, occurredAt, kind, jobRef, computeNode, detail]
      properties:
        sequence: {type: integer, minimum: 1}
        occurredAt: {$ref: '#/components/schemas/Timestamp'}
        kind: {$ref: '#/components/schemas/RuntimeEventKind'}
        jobRef: {oneOf: [{$ref: '#/components/schemas/OpaqueRef'}, {type: 'null'}]}
        computeNode: {oneOf: [{type: string, minLength: 1, maxLength: 128}, {type: 'null'}]}
        detail:
          type: object
          x-kcs-maxCanonicalBytes: 1024
          additionalProperties:
            oneOf:
              - {type: string}
              - {type: integer}
              - {type: boolean}
              - {type: 'null'}
              - {type: array, items: {type: string}}
    RuntimeEventPage:
      type: object
      additionalProperties: false
      required: [events, nextCursor, truncated]
      properties:
        events:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/RuntimeEvent'}
        nextCursor: {$ref: '#/components/schemas/OpaqueCursor'}
        truncated: {type: boolean}
      x-kcs-maxCanonicalBytes: 262144
    ObservabilityHealth:
      type: object
      additionalProperties: false
      required: [prometheus, dcgm, kubeStateMetrics, oldestScrapeAgeSeconds]
      properties:
        prometheus: {type: string, enum: [up, down]}
        dcgm: {type: string, enum: [up, down]}
        kubeStateMetrics: {type: string, enum: [up, down]}
        oldestScrapeAgeSeconds: {oneOf: [{type: integer, minimum: 0}, {type: 'null'}]}
    AgentResources:
      type: object
      additionalProperties: false
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 8000, default: 1000}
        memoryMiB: {type: integer, minimum: 1, maximum: 32768, default: 2048}
    WorkspaceResources:
      type: object
      additionalProperties: false
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 64000, default: 2000}
        memoryMiB: {type: integer, minimum: 1, maximum: 262144, default: 8192}
        gpu: {type: integer, minimum: 0, maximum: 8, default: 0}
    AgentSpec:
      type: object
      additionalProperties: false
      required: [image, command]
      properties:
        image: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        command: {type: array, const: [/opt/kcs/agent-supervisor]}
        resources: {$ref: '#/components/schemas/AgentResources'}
        runtimeEnv: {$ref: '#/components/schemas/Environment'}
    WorkspaceSpec:
      type: object
      additionalProperties: false
      required: [image, command]
      properties:
        image: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        command: {type: array, const: [/opt/kcs/workspace-sidecar]}
        resources: {$ref: '#/components/schemas/WorkspaceResources'}
        runtimeEnv: {$ref: '#/components/schemas/Environment'}
    SharedWorkspaceSpec:
      type: object
      additionalProperties: false
      required: [kind, mountPath, sizeLimitGiB]
      properties:
        kind: {type: string, const: ephemeral}
        mountPath: {type: string, const: /workspace}
        sizeLimitGiB: {type: integer, minimum: 1, maximum: 100, default: 20}
    JobSpec:
      type: object
      additionalProperties: false
      x-kcs-default-semantics: omission-is-distinct
      required: [subjectRef, runtimePlanDigest, agent, workspace, sharedWorkspace, nodeSelector, activeDeadlineSeconds]
      properties:
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        runtimePlanDigest: {$ref: '#/components/schemas/Sha256'}
        agent: {$ref: '#/components/schemas/AgentSpec'}
        workspace: {$ref: '#/components/schemas/WorkspaceSpec'}
        sharedWorkspace: {$ref: '#/components/schemas/SharedWorkspaceSpec'}
        nodeSelector: {$ref: '#/components/schemas/NodeSelector'}
        activeDeadlineSeconds: {type: integer, minimum: 1, maximum: 86400, default: 21600}
    SelectedModelProtocol:
      type: string
      enum: [openai-responses, openai-completions, anthropic-messages]
    NativeAcceleratorRequest:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [kind]
            properties: {kind: {const: none}}
          then:
            properties: {count: {const: 0}}
          else:
            properties: {count: {type: integer, minimum: 1, maximum: 8}}
      required: [kind, count]
      properties:
        kind: {type: string, enum: [none, nvidia-gpu]}
        count: {type: integer, minimum: 0, maximum: 8}
    NativeRuntimeResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, ephemeralStorageMiB, accelerator]
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 64000}
        memoryMiB: {type: integer, minimum: 1, maximum: 262144}
        ephemeralStorageMiB:
          type: integer
          minimum: 1
          description: >-
            Requested Pod ephemeral-storage for writable layers, logs, and disk-backed
            emptyDir volumes. OCI image layers are accounted separately by
            ImageFilesystemEstimate. The platform policy supplies the upper bound.
        accelerator: {$ref: '#/components/schemas/NativeAcceleratorRequest'}
    NativeModelEnv:
      type: object
      additionalProperties: false
      x-kcs-configured-gateway-only: true
      required: [OPENAI_BASE_URL, ANTHROPIC_BASE_URL, MODEL_ROUTE, RC_MODEL_GATEWAY_TOKEN_FILE]
      properties:
        OPENAI_BASE_URL: {type: string, format: uri, pattern: '^https://'}
        ANTHROPIC_BASE_URL: {type: string, format: uri, pattern: '^https://'}
        MODEL_ROUTE: {$ref: '#/components/schemas/OpaqueRef'}
        RC_MODEL_GATEWAY_TOKEN_FILE: {type: string, const: /var/run/rc/model-gateway/token}
    NativeRuntimeSpec:
      type: object
      additionalProperties: false
      required: [runnerRef, environmentProfileRef, taskPath, runnerDeadlineSeconds, selectedModelProtocol, modelEnv, resources, assemblyDigest]
      properties:
        runnerRef: {$ref: '#/components/schemas/OpaqueRef'}
        environmentProfileRef: {$ref: '#/components/schemas/OpaqueRef'}
        taskPath: {type: string, const: /workspace/worktree/TASK.md}
        runnerDeadlineSeconds: {type: integer, minimum: 1}
        selectedModelProtocol: {$ref: '#/components/schemas/SelectedModelProtocol'}
        modelEnv: {$ref: '#/components/schemas/NativeModelEnv'}
        resources: {$ref: '#/components/schemas/NativeRuntimeResources'}
        assemblyDigest: {$ref: '#/components/schemas/Sha256'}
    NativeJobSpec:
      type: object
      additionalProperties: false
      x-kcs-placement-owner: kcs
      required: [subjectRef, runtimePlanDigest, sharedWorkspace, native]
      properties:
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        runtimePlanDigest: {$ref: '#/components/schemas/Sha256'}
        sharedWorkspace: {$ref: '#/components/schemas/SharedWorkspaceSpec'}
        native: {$ref: '#/components/schemas/NativeRuntimeSpec'}
    CreateJobSpec:
      oneOf:
        - {$ref: '#/components/schemas/JobSpec'}
        - {$ref: '#/components/schemas/NativeJobSpec'}
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [providerRequestId, specDigest, spec]
      properties:
        providerRequestId: {$ref: '#/components/schemas/OpaqueRef'}
        specDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/CreateJobSpec'}
    JobBindingState: {type: string, enum: [provisioning, bound, running, finalizing, succeeded, failed, canceling, canceled, indeterminate, deleting, deleted]}
    ProviderTerminalState: {type: string, enum: [succeeded, failed, canceled, indeterminate]}
    RoleState: {type: string, enum: [waiting, running, terminated, unknown, indeterminate]}
    RunnerState: {type: string, enum: [not_started, accepted, starting, running, exited, failed, indeterminate]}
    RuntimeLane: {type: string, enum: [hosted, native]}
    NativeRunnerState: {type: string, enum: [starting, running, exited, killed]}
    RunnerStopCause:
      type: string
      enum: [none, natural_exit, stop_requested, soft_deadline, cancel_requested, oom_killed, hard_deadline, node_lost, provider_lost, unknown]
    ProcessExitObservation:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [kind]
            properties: {kind: {const: not_observed}}
          then:
            properties: {exitCode: {type: 'null'}, signal: {type: 'null'}}
        - if:
            required: [kind]
            properties: {kind: {const: exited}}
          then:
            properties: {exitCode: {type: integer}, signal: {type: 'null'}}
        - if:
            required: [kind]
            properties: {kind: {const: signaled}}
          then:
            properties: {exitCode: {type: 'null'}, signal: {type: integer, minimum: 1}}
      required: [kind, exitCode, signal]
      properties:
        kind: {type: string, enum: [not_observed, exited, signaled]}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        signal: {$ref: '#/components/schemas/NullableInteger'}
    ProtocolTerminalObservation:
      type: object
      additionalProperties: false
      required: [observed, eventKind, stopReason, errorCode]
      properties:
        observed: {type: boolean}
        eventKind: {$ref: '#/components/schemas/NullableString'}
        stopReason: {$ref: '#/components/schemas/NullableString'}
        errorCode: {$ref: '#/components/schemas/NullableString'}
    NativeRunnerObservation:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [state]
            properties: {state: {const: exited}}
          then:
            properties: {stopCause: {const: natural_exit}}
        - if:
            required: [stopCause]
            properties:
              stopCause: {enum: [stop_requested, soft_deadline, cancel_requested, oom_killed, hard_deadline]}
          then:
            properties: {state: {const: killed}}
      required: [state, sequence, stateDigest, childPid, processExit, stopCause, protocolTerminal, childStartedAt, childFinishedAt, observedAt]
      properties:
        state: {$ref: '#/components/schemas/NativeRunnerState'}
        sequence: {type: integer, minimum: 1}
        stateDigest: {$ref: '#/components/schemas/Sha256'}
        childPid: {$ref: '#/components/schemas/NullableInteger'}
        processExit: {$ref: '#/components/schemas/ProcessExitObservation'}
        stopCause: {$ref: '#/components/schemas/RunnerStopCause'}
        protocolTerminal: {$ref: '#/components/schemas/ProtocolTerminalObservation'}
        childStartedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        childFinishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    CredentialState: {type: string, enum: [accepted, available, acknowledged, consumed, destroyed, expired, revoked, destroy_failed, indeterminate]}
    TransferState: {type: string, enum: [registered, staging, available, streaming, completed, canceling, canceled, discarded, failed, indeterminate]}
    OperationState: {type: string, enum: [accepted, running, succeeded, failed, indeterminate]}
    ActionState: {type: string, enum: [not_requested, accepted, running, succeeded, failed, indeterminate]}
    CleanupState: {type: string, enum: [not_required, pending, complete, failed, indeterminate]}
    AgentRequestedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 8000}
        memoryMiB: {type: integer, minimum: 1, maximum: 32768}
        gpu: {type: integer, const: 0}
        storageGiB: {type: integer, minimum: 1, maximum: 100}
    AgentObservedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {oneOf: [{type: integer, minimum: 0, maximum: 8000}, {type: 'null'}]}
        memoryMiB: {oneOf: [{type: integer, minimum: 0, maximum: 32768}, {type: 'null'}]}
        gpu: {oneOf: [{type: integer, const: 0}, {type: 'null'}]}
        storageGiB: {oneOf: [{type: integer, minimum: 0, maximum: 100}, {type: 'null'}]}
    WorkspaceRequestedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 64000}
        memoryMiB: {type: integer, minimum: 1, maximum: 262144}
        gpu: {type: integer, minimum: 0, maximum: 8}
        storageGiB: {type: integer, minimum: 1, maximum: 100}
    WorkspaceObservedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {oneOf: [{type: integer, minimum: 0, maximum: 64000}, {type: 'null'}]}
        memoryMiB: {oneOf: [{type: integer, minimum: 0, maximum: 262144}, {type: 'null'}]}
        gpu: {oneOf: [{type: integer, minimum: 0, maximum: 8}, {type: 'null'}]}
        storageGiB: {oneOf: [{type: integer, minimum: 0, maximum: 100}, {type: 'null'}]}
    AgentRoleSnapshot:
      type: object
      additionalProperties: false
      required: [containerId, imageId, state, ready, restartCount, exitCode, reason, startedAt, finishedAt, requested, observed]
      properties:
        containerId: {$ref: '#/components/schemas/NullableString'}
        imageId: {$ref: '#/components/schemas/NullableString'}
        state: {$ref: '#/components/schemas/RoleState'}
        ready: {type: boolean}
        restartCount: {type: integer, minimum: 0}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        reason: {$ref: '#/components/schemas/NullableString'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        finishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        requested: {$ref: '#/components/schemas/AgentRequestedResources'}
        observed: {$ref: '#/components/schemas/AgentObservedResources'}
    WorkspaceRoleSnapshot:
      type: object
      additionalProperties: false
      required: [containerId, imageId, state, ready, restartCount, exitCode, reason, startedAt, finishedAt, requested, observed]
      properties:
        containerId: {$ref: '#/components/schemas/NullableString'}
        imageId: {$ref: '#/components/schemas/NullableString'}
        state: {$ref: '#/components/schemas/RoleState'}
        ready: {type: boolean}
        restartCount: {type: integer, minimum: 0}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        reason: {$ref: '#/components/schemas/NullableString'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        finishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        requested: {$ref: '#/components/schemas/WorkspaceRequestedResources'}
        observed: {$ref: '#/components/schemas/WorkspaceObservedResources'}
    PodIncarnationState: {type: string, enum: [pending, running, succeeded, failed, unknown]}
    PodIncarnationSnapshot:
      type: object
      additionalProperties: false
      required: [podName, podUid, nodeName, state, reason, startedAt, finishedAt, observedAt]
      properties:
        podName: {type: string, minLength: 1, maxLength: 253}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        nodeName: {$ref: '#/components/schemas/NullableString'}
        state: {$ref: '#/components/schemas/PodIncarnationState'}
        reason: {$ref: '#/components/schemas/NullableString'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        finishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    BindingIdentity:
      type: object
      additionalProperties: false
      required: [jobUid, podUid]
      properties:
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
    GenerationSnapshot:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [runnerState]
            properties: {runnerState: {const: exited}}
          then:
            properties:
              finishedAt: {$ref: '#/components/schemas/Timestamp'}
              exitCode: {type: integer}
      required: [jobRef, generation, agentRunRef, executionEnvelopeRef, executionEnvelopeDigest, launchBundlePath, launchBundleDigest, launchBundleSizeBytes, materialPaths, credentialGrantRef, startMetadataDigest, runnerState, supervisorAlive, pid, exitCode, startedAt, finishedAt, observedAt, replayed, credentialAcknowledgedAt, credentialDestroyedAt]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        generation: {type: integer, minimum: 1}
        agentRunRef: {$ref: '#/components/schemas/OpaqueRef'}
        executionEnvelopeRef: {$ref: '#/components/schemas/OpaqueRef'}
        executionEnvelopeDigest: {$ref: '#/components/schemas/Sha256'}
        launchBundlePath: {$ref: '#/components/schemas/SafeRelativePath'}
        launchBundleDigest: {$ref: '#/components/schemas/Sha256'}
        launchBundleSizeBytes: {type: integer, minimum: 0, maximum: 1048576}
        materialPaths: {type: array, uniqueItems: true, x-kcs-casefoldUnique: true, items: {$ref: '#/components/schemas/SafeRelativePath'}}
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
        startMetadataDigest: {$ref: '#/components/schemas/Sha256'}
        runnerState: {$ref: '#/components/schemas/RunnerState'}
        supervisorAlive: {type: boolean}
        pid: {$ref: '#/components/schemas/NullableInteger'}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        finishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        replayed: {type: boolean}
        credentialAcknowledgedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        credentialDestroyedAt: {$ref: '#/components/schemas/NullableTimestamp'}
    AgentStartRequest:
      type: object
      additionalProperties: false
      required: [executionEnvelopeRef, executionEnvelopeDigest, agentRunRef, generation, launchBundlePath, launchBundleDigest, launchBundleSizeBytes, materialPaths, credentialGrantRef]
      properties:
        executionEnvelopeRef: {$ref: '#/components/schemas/OpaqueRef'}
        executionEnvelopeDigest: {$ref: '#/components/schemas/Sha256'}
        agentRunRef: {$ref: '#/components/schemas/OpaqueRef'}
        generation: {type: integer, minimum: 1}
        launchBundlePath: {$ref: '#/components/schemas/SafeRelativePath'}
        launchBundleDigest: {$ref: '#/components/schemas/Sha256'}
        launchBundleSizeBytes: {type: integer, minimum: 0, maximum: 1048576}
        materialPaths: {type: array, uniqueItems: true, x-kcs-casefoldUnique: true, items: {$ref: '#/components/schemas/SafeRelativePath'}}
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
    NativeLaunchDescriptor:
      type: object
      additionalProperties: false
      required: [executionEnvelopeRef, executionEnvelopeDigest, agentRunRef, generation, jobUid, podUid, assemblyDigest, recipeDigest, taskPath, baseManifestDigest, stagingTransferRefs, selectedModelProtocol, credentialGrantRef]
      properties:
        executionEnvelopeRef: {$ref: '#/components/schemas/OpaqueRef'}
        executionEnvelopeDigest: {$ref: '#/components/schemas/Sha256'}
        agentRunRef: {$ref: '#/components/schemas/OpaqueRef'}
        generation: {type: integer, minimum: 1}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        assemblyDigest: {$ref: '#/components/schemas/Sha256'}
        recipeDigest: {$ref: '#/components/schemas/Sha256'}
        taskPath: {type: string, const: /workspace/worktree/TASK.md}
        baseManifestDigest: {$ref: '#/components/schemas/Sha256'}
        stagingTransferRefs:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/OpaqueRef'}
        selectedModelProtocol: {$ref: '#/components/schemas/SelectedModelProtocol'}
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
    RunnerStartRequest:
      type: object
      additionalProperties: false
      x-kcs-native-launch-digest:
        algorithm: sha256
        canonicalization: rfc8785-jcs
        value: descriptor
        digestField: nativeLaunchDigest
      x-kcs-relations:
        - {left: generation, operator: '=', right: descriptor.generation}
      required: [generation, nativeLaunchDigest, descriptor]
      properties:
        generation: {type: integer, minimum: 1}
        nativeLaunchDigest: {$ref: '#/components/schemas/Sha256'}
        descriptor: {$ref: '#/components/schemas/NativeLaunchDescriptor'}
    NativeRunnerGenerationSnapshot:
      type: object
      additionalProperties: false
      required: [jobRef, generation, agentRunRef, nativeLaunchDigest, credentialGrantRef, runnerStartMetadataDigest, runnerObservation, launcherAlive, softTimerStartedAt, softDeadlineAt, observedAt, replayed, credentialAcknowledgedAt, credentialDestroyedAt]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        generation: {type: integer, minimum: 1}
        agentRunRef: {$ref: '#/components/schemas/OpaqueRef'}
        nativeLaunchDigest: {$ref: '#/components/schemas/Sha256'}
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
        runnerStartMetadataDigest: {$ref: '#/components/schemas/Sha256'}
        runnerObservation: {$ref: '#/components/schemas/NativeRunnerObservation'}
        launcherAlive: {type: boolean}
        softTimerStartedAt:
          description: KCS acceptance timestamp for startRunner; this is the sole soft-deadline timer origin.
          allOf: [{$ref: '#/components/schemas/Timestamp'}]
        softDeadlineAt: {$ref: '#/components/schemas/Timestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        replayed: {type: boolean}
        credentialAcknowledgedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        credentialDestroyedAt: {$ref: '#/components/schemas/NullableTimestamp'}
    RunnerStopReason:
      type: string
      enum: [stop_requested, cancel_requested, soft_deadline]
    RunnerStopSpec:
      type: object
      additionalProperties: false
      required: [jobUid, podUid, generation, reason]
      properties:
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        generation: {type: integer, minimum: 1}
        reason: {$ref: '#/components/schemas/RunnerStopReason'}
    RunnerStopRequest:
      type: object
      additionalProperties: false
      required: [stopRef, requestDigest, spec]
      properties:
        stopRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/RunnerStopSpec'}
    RunnerStopSnapshot:
      type: object
      additionalProperties: false
      required: [jobRef, stopRef, requestDigest, binding, generation, state, result, termSentAt, killSentAt, runnerTerminalAt, runnerObservation, observedAt, replayed]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        stopRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        binding: {$ref: '#/components/schemas/BindingIdentity'}
        generation: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/ActionState'}
        result: {type: string, enum: [already_terminal, terminated, killed, indeterminate]}
        termSentAt: {$ref: '#/components/schemas/NullableTimestamp'}
        killSentAt: {$ref: '#/components/schemas/NullableTimestamp'}
        runnerTerminalAt: {$ref: '#/components/schemas/NullableTimestamp'}
        runnerObservation: {$ref: '#/components/schemas/NativeRunnerObservation'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        replayed: {type: boolean}
    RuntimeRecipeDeliveryMode: {type: string, enum: [assembled, prebuilt]}
    RuntimeIdentity:
      type: object
      additionalProperties: false
      required: [runtimeUid, runtimeGid, launcherUid, launcherGid, experimentUid, experimentGid, terminalUid, terminalGid]
      properties:
        runtimeUid: {type: integer, const: 0}
        runtimeGid: {type: integer, const: 0}
        launcherUid: {type: integer, const: 0}
        launcherGid: {type: integer, const: 0}
        experimentUid: {type: integer, const: 10001}
        experimentGid: {type: integer, const: 10001}
        terminalUid: {type: integer, const: 10002}
        terminalGid: {type: integer, const: 10001}
    RuntimeRecipeMount:
      type: object
      additionalProperties: false
      allOf:
        - if: {required: [role], properties: {role: {const: workspace}}}
          then: {properties: {mountPath: {const: /workspace}, readOnly: {const: false}}}
        - if: {required: [role], properties: {role: {const: platform}}}
          then: {properties: {mountPath: {const: /opt/rc-platform}, readOnly: {const: true}}}
        - if: {required: [role], properties: {role: {const: runner}}}
          then: {properties: {mountPath: {const: /opt/rc-runner}, readOnly: {const: true}}}
        - if: {required: [role], properties: {role: {const: control}}}
          then: {properties: {mountPath: {const: /run/rc-control}, readOnly: {const: false}}}
        - if: {required: [role], properties: {role: {const: credential}}}
          then: {properties: {mountPath: {const: /var/run/rc/model-gateway}, readOnly: {const: true}}}
        - if: {required: [role], properties: {role: {const: userHome}}}
          then: {properties: {mountPath: {const: /run/rc-user/home}, readOnly: {const: false}}}
        - if: {required: [role], properties: {role: {const: userTmp}}}
          then: {properties: {mountPath: {const: /run/rc-user/tmp}, readOnly: {const: false}}}
        - if: {required: [role], properties: {role: {const: terminalHome}}}
          then: {properties: {mountPath: {const: /run/rc-terminal/home}, readOnly: {const: false}}}
        - if: {required: [role], properties: {role: {const: terminalTmp}}}
          then: {properties: {mountPath: {const: /run/rc-terminal/tmp}, readOnly: {const: false}}}
      required: [role, mountPath, readOnly]
      properties:
        role: {type: string, enum: [workspace, platform, runner, control, credential, userHome, userTmp, terminalHome, terminalTmp]}
        mountPath: {type: string, minLength: 1, pattern: '^/'}
        readOnly: {type: boolean}
    AssembledRecipeDelivery:
      type: object
      additionalProperties: false
      required: [mode, transport, environmentImageDigest, platformImageVolumeDigest, runnerImageVolumeDigest, controlImageDigest]
      properties:
        mode: {type: string, const: assembled}
        transport: {type: string, const: imageVolume}
        environmentImageDigest: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        platformImageVolumeDigest: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        runnerImageVolumeDigest: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        controlImageDigest: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
    PrebuiltRecipeDelivery:
      type: object
      additionalProperties: false
      required: [mode, prebuiltImageDigest, platformImageVolumeDigest, controlImageDigest]
      properties:
        mode: {type: string, const: prebuilt}
        prebuiltImageDigest: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        platformImageVolumeDigest: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        controlImageDigest: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
    RuntimeRecipeDelivery:
      oneOf:
        - {$ref: '#/components/schemas/AssembledRecipeDelivery'}
        - {$ref: '#/components/schemas/PrebuiltRecipeDelivery'}
    ImageFilesystemEstimate:
      type: object
      additionalProperties: false
      description: >-
        KCS admission/headroom estimate after deduplicating environment, platform,
        and runner image layers. These bytes are not Pod ephemeral-storage usage.
      required: [imageFsCompressedBytes, imageFsUnpackedBytes]
      properties:
        imageFsCompressedBytes: {type: integer, minimum: 0}
        imageFsUnpackedBytes: {type: integer, minimum: 0}
    ResolvedRuntimeRecipe:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [delivery]
            properties:
              delivery: {required: [mode], properties: {mode: {const: assembled}}}
          then:
            properties:
              mounts:
                minItems: 9
                maxItems: 9
                contains: {required: [role], properties: {role: {const: runner}}}
                minContains: 1
                maxContains: 1
              runnerEntrypoint:
                prefixItems: [{type: string, pattern: '^/opt/rc-runner/'}]
          else:
            properties: {mounts: {minItems: 8, maxItems: 8}}
      required: [runnerRef, environmentProfileRef, recipeRef, recipeDigest, delivery, imageFilesystem, launcherCommand, runnerEntrypoint, controlCommand, launcherSocketPath, identity, mounts, supportedModelProtocols, observedAt]
      properties:
        runnerRef: {$ref: '#/components/schemas/OpaqueRef'}
        environmentProfileRef: {$ref: '#/components/schemas/OpaqueRef'}
        recipeRef: {$ref: '#/components/schemas/OpaqueRef'}
        recipeDigest: {$ref: '#/components/schemas/Sha256'}
        delivery: {$ref: '#/components/schemas/RuntimeRecipeDelivery'}
        imageFilesystem: {$ref: '#/components/schemas/ImageFilesystemEstimate'}
        launcherCommand:
          type: array
          const: [/opt/rc-platform/bin/rc-native-launcher]
          description: The runtime container's only PID 1 command.
        runnerEntrypoint:
          type: array
          minItems: 1
          prefixItems: [{type: string, pattern: '^/'}]
          items: {type: string}
          description: Child argv executed only by rc-native-launcher after the identity transition.
        controlCommand:
          type: array
          const: [/opt/kcs/workspace-sidecar, rpc]
        launcherSocketPath: {type: string, const: /run/rc-control/launcher.sock}
        identity: {$ref: '#/components/schemas/RuntimeIdentity'}
        mounts:
          type: array
          minItems: 8
          maxItems: 9
          uniqueItems: true
          x-kcs-uniqueBy: role
          allOf:
            - {contains: {required: [role], properties: {role: {const: workspace}}}, minContains: 1, maxContains: 1}
            - {contains: {required: [role], properties: {role: {const: platform}}}, minContains: 1, maxContains: 1}
            - {contains: {required: [role], properties: {role: {const: control}}}, minContains: 1, maxContains: 1}
            - {contains: {required: [role], properties: {role: {const: credential}}}, minContains: 1, maxContains: 1}
            - {contains: {required: [role], properties: {role: {const: userHome}}}, minContains: 1, maxContains: 1}
            - {contains: {required: [role], properties: {role: {const: userTmp}}}, minContains: 1, maxContains: 1}
            - {contains: {required: [role], properties: {role: {const: terminalHome}}}, minContains: 1, maxContains: 1}
            - {contains: {required: [role], properties: {role: {const: terminalTmp}}}, minContains: 1, maxContains: 1}
          items: {$ref: '#/components/schemas/RuntimeRecipeMount'}
        supportedModelProtocols:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/SelectedModelProtocol'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    ActionSnapshot:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [state]
            properties: {state: {const: not_requested}}
          then:
            properties:
              actionRef: {type: 'null'}
              requestDigest: {type: 'null'}
              observedAt: {type: 'null'}
          else:
            properties:
              actionRef: {$ref: '#/components/schemas/OpaqueRef'}
              requestDigest: {$ref: '#/components/schemas/Sha256'}
              observedAt: {$ref: '#/components/schemas/Timestamp'}
      required: [actionRef, requestDigest, state, observedAt]
      properties:
        actionRef: {$ref: '#/components/schemas/NullableOpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/NullableSha256'}
        state: {$ref: '#/components/schemas/ActionState'}
        observedAt: {$ref: '#/components/schemas/NullableTimestamp'}
    CleanupObservation:
      type: object
      additionalProperties: false
      required: [state, reason, observedAt]
      properties:
        state: {$ref: '#/components/schemas/CleanupState'}
        reason: {$ref: '#/components/schemas/NullableString'}
        observedAt: {$ref: '#/components/schemas/NullableTimestamp'}
    CredentialObservation:
      type: object
      additionalProperties: false
      required: [credentialGrantRef, state, secretPresent, observedAt]
      properties:
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
        state: {$ref: '#/components/schemas/CredentialState'}
        secretPresent: {$ref: '#/components/schemas/NullableBoolean'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    TransferObservation:
      type: object
      additionalProperties: false
      required: [transferRef, state, observedAt]
      properties:
        transferRef: {$ref: '#/components/schemas/OpaqueRef'}
        state: {$ref: '#/components/schemas/TransferState'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    TerminalState: {type: string, enum: [opening, open, closed, expired, lost]}
    TerminalCreateSpec:
      type: object
      additionalProperties: false
      required: [subjectRef, jobUid, podUid, ttlSeconds]
      properties:
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        ttlSeconds: {type: integer, minimum: 1, maximum: 900, default: 300}
    TerminalCreateRequest:
      type: object
      additionalProperties: false
      required: [terminalRef, requestDigest, spec]
      properties:
        terminalRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/TerminalCreateSpec'}
    TerminalResizeRequest:
      type: object
      additionalProperties: false
      required: [rows, columns]
      properties:
        rows: {type: integer, minimum: 1, maximum: 1000}
        columns: {type: integer, minimum: 1, maximum: 1000}
    TerminalSessionSnapshot:
      type: object
      additionalProperties: false
      required: [terminalRef, requestDigest, subjectRef, jobRef, jobUid, podUid, container, state, createdAt, expiresAt, observedAt, writable, agentPaused]
      properties:
        terminalRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        container: {type: string, const: workspace}
        state: {$ref: '#/components/schemas/TerminalState'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        writable: {type: boolean, const: true}
        agentPaused: {type: boolean}
    NativeTerminalSessionSnapshot:
      type: object
      additionalProperties: false
      x-kcs-relations:
        - {left: ptyRef, operator: '=', right: terminalRef}
      required: [terminalRef, ptyRef, requestDigest, subjectRef, jobRef, jobUid, podUid, container, state, createdAt, expiresAt, observedAt, writable, runnerPaused, launcherMediated, shellCommand, effectiveUid, effectiveGid, effectiveCapabilities, noNewPrivileges, umask, cwd, home, tmpdir]
      properties:
        terminalRef: {$ref: '#/components/schemas/OpaqueRef'}
        ptyRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        container: {type: string, const: runner}
        state: {$ref: '#/components/schemas/TerminalState'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        writable: {type: boolean, const: true}
        runnerPaused: {type: boolean, const: true}
        launcherMediated: {type: boolean, const: true}
        shellCommand: {type: array, const: [/bin/sh]}
        effectiveUid: {type: integer, const: 10002}
        effectiveGid: {type: integer, const: 10001}
        effectiveCapabilities: {type: array, const: []}
        noNewPrivileges: {type: boolean, const: true}
        umask: {type: string, const: '0002'}
        cwd: {type: string, const: /workspace/worktree}
        home: {type: string, const: /run/rc-terminal/home}
        tmpdir: {type: string, const: /run/rc-terminal/tmp}
    AnyTerminalSessionSnapshot:
      oneOf:
        - {$ref: '#/components/schemas/TerminalSessionSnapshot'}
        - {$ref: '#/components/schemas/NativeTerminalSessionSnapshot'}
    JobBindingSnapshot:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [bindingState]
            properties: {bindingState: {const: running}}
          then:
            properties:
              observedPodCount: {type: integer, minimum: 1}
              podUid: {$ref: '#/components/schemas/KubernetesUid'}
        - if:
            required: [bindingState]
            properties: {bindingState: {const: finalizing}}
          then:
            properties:
              finalizeAction:
                properties: {state: {not: {const: not_requested}}}
        - if:
            required: [bindingState]
            properties: {bindingState: {const: canceling}}
          then:
            properties:
              cancelAction:
                properties: {state: {not: {const: not_requested}}}
        - if:
            required: [bindingState]
            properties: {bindingState: {const: deleting}}
          then:
            properties:
              deleteAction:
                properties: {state: {not: {const: not_requested}}}
      required: [jobRef, providerHandle, providerRequestId, subjectRef, runtimePlanDigest, specDigest, jobUid, podUid, resourceVersion, nodeName, bindingState, bindingReason, observedPodCount, podIncarnations, createdAt, updatedAt, startedAt, finishedAt, observedAt, agent, workspace, latestAgentGeneration, activeOperationRefs, terminalOperationRefs, credentialObservations, transferObservations, finalizeAction, cancelAction, deleteAction, outputLossPossible, cleanup, gpuRelease]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        providerHandle: {$ref: '#/components/schemas/OpaqueRef'}
        providerRequestId: {$ref: '#/components/schemas/OpaqueRef'}
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        runtimePlanDigest: {$ref: '#/components/schemas/Sha256'}
        specDigest: {$ref: '#/components/schemas/Sha256'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid:
          oneOf: [{$ref: '#/components/schemas/KubernetesUid'}, {type: 'null'}]
        resourceVersion: {$ref: '#/components/schemas/NullableString'}
        nodeName: {$ref: '#/components/schemas/NullableString'}
        bindingState: {$ref: '#/components/schemas/JobBindingState'}
        bindingReason: {$ref: '#/components/schemas/NullableString'}
        observedPodCount: {type: integer, minimum: 0}
        podIncarnations: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/PodIncarnationSnapshot'}}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
