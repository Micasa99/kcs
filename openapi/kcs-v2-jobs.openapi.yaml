    CredentialGrantSnapshot:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [state]
            properties: {state: {const: accepted}}
          then:
            properties:
              availableAt: {type: 'null'}
              acknowledgedAt: {type: 'null'}
              ackAgentRunRef: {type: 'null'}
              ackGeneration: {type: 'null'}
              consumedAt: {type: 'null'}
              destroyedAt: {type: 'null'}
              destroyFailureReason: {type: 'null'}
        - if:
            required: [state]
            properties: {state: {const: available}}
          then:
            properties:
              availableAt: {$ref: '#/components/schemas/Timestamp'}
              acknowledgedAt: {type: 'null'}
              ackAgentRunRef: {type: 'null'}
              ackGeneration: {type: 'null'}
              consumedAt: {type: 'null'}
              destroyedAt: {type: 'null'}
              secretPresent: {const: true}
              destroyFailureReason: {type: 'null'}
        - if:
            required: [state]
            properties: {state: {const: acknowledged}}
          then:
            properties:
              availableAt: {$ref: '#/components/schemas/Timestamp'}
              acknowledgedAt: {$ref: '#/components/schemas/Timestamp'}
              ackAgentRunRef: {$ref: '#/components/schemas/OpaqueRef'}
              ackGeneration: {type: integer, minimum: 1}
              consumedAt: {type: 'null'}
              destroyedAt: {type: 'null'}
              destroyFailureReason: {type: 'null'}
        - if:
            required: [state]
            properties: {state: {const: consumed}}
          then:
            properties:
              consumedAt: {$ref: '#/components/schemas/Timestamp'}
        - if:
            required: [state]
            properties: {state: {const: destroyed}}
          then:
            properties:
              destroyedAt: {$ref: '#/components/schemas/Timestamp'}
              secretPresent: {const: false}
              destroyFailureReason: {type: 'null'}
        - if:
            required: [state]
            properties: {state: {const: destroy_failed}}
          then:
            properties:
              destroyedAt: {type: 'null'}
              destroyFailureReason: {type: string, minLength: 1}
      required: [credentialGrantRef, credentialSha256, grantMetadataDigest, agentRunRef, generation, launchBundleDigest, audience, ttlSeconds, jobRef, jobUid, podUid, state, acceptedAt, availableAt, acknowledgedAt, ackAgentRunRef, ackGeneration, consumedAt, destroyedAt, expiresAt, tombstoneExpiresAt, secretPresent, destroyFailureReason, observedAt]
      properties:
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
        credentialSha256: {$ref: '#/components/schemas/Sha256'}
        grantMetadataDigest: {$ref: '#/components/schemas/Sha256'}
        agentRunRef: {$ref: '#/components/schemas/OpaqueRef'}
        generation: {type: integer, minimum: 1}
        launchBundleDigest: {$ref: '#/components/schemas/Sha256'}
        audience: {$ref: '#/components/schemas/OpaqueRef'}
        ttlSeconds: {type: integer, minimum: 1, maximum: 900}
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        state: {$ref: '#/components/schemas/CredentialState'}
        acceptedAt: {$ref: '#/components/schemas/Timestamp'}
        availableAt: {$ref: '#/components/schemas/NullableTimestamp'}
        acknowledgedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        ackAgentRunRef: {$ref: '#/components/schemas/NullableOpaqueRef'}
        ackGeneration:
          oneOf: [{type: integer, minimum: 1}, {type: 'null'}]
        consumedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        destroyedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        tombstoneExpiresAt: {$ref: '#/components/schemas/Timestamp'}
        secretPresent: {$ref: '#/components/schemas/NullableBoolean'}
        destroyFailureReason: {$ref: '#/components/schemas/NullableString'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    RunnerCredentialGrantSnapshot:
      type: object
      additionalProperties: false
      description: >-
        KCS projection lifecycle only. projectionTtlSeconds and projectionExpiresAt
        are not the model-gateway token claim lifetime.
      required: [credentialGrantRef, kind, credentialSha256, grantMetadataDigest, agentRunRef, generation, nativeLaunchDigest, audience, projectionTtlSeconds, jobRef, jobUid, podUid, state, acceptedAt, availableAt, acknowledgedAt, ackAgentRunRef, ackGeneration, consumedAt, destroyedAt, projectionExpiresAt, tombstoneExpiresAt, secretPresent, destroyFailureReason, observedAt]
      properties:
        credentialGrantRef: {$ref: '#/components/schemas/OpaqueRef'}
        kind: {type: string, const: modelGatewayToken}
        credentialSha256: {$ref: '#/components/schemas/Sha256'}
        grantMetadataDigest: {$ref: '#/components/schemas/Sha256'}
        agentRunRef: {$ref: '#/components/schemas/OpaqueRef'}
        generation: {type: integer, minimum: 1}
        nativeLaunchDigest: {$ref: '#/components/schemas/Sha256'}
        audience: {$ref: '#/components/schemas/OpaqueRef'}
        projectionTtlSeconds:
          type: integer
          minimum: 120
          maximum: 900
          description: KCS projection lease only; gateway claim TTL is intentionally not represented.
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        state: {$ref: '#/components/schemas/CredentialState'}
        acceptedAt: {$ref: '#/components/schemas/Timestamp'}
        availableAt: {$ref: '#/components/schemas/NullableTimestamp'}
        acknowledgedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        ackAgentRunRef: {$ref: '#/components/schemas/NullableOpaqueRef'}
        ackGeneration:
          oneOf: [{type: integer, minimum: 1}, {type: 'null'}]
        consumedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        destroyedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        projectionExpiresAt: {$ref: '#/components/schemas/Timestamp'}
        tombstoneExpiresAt: {$ref: '#/components/schemas/Timestamp'}
        secretPresent: {$ref: '#/components/schemas/NullableBoolean'}
        destroyFailureReason: {$ref: '#/components/schemas/NullableString'}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
    SafeRelativePath:
      type: string
      minLength: 1
      format: kcs-relative-posix-path
      x-kcs-case-policy: preserve-case-reject-casefold-collisions
      x-kcs-unicode-policy:
        normalization: NFC
        rejectedGeneralCategories: [Cc, Cf, Cs, Co, Cn, Zl, Zp]
      description: Normalized relative POSIX path with no empty, dot, dot-dot, control, symlink, case, or normalization ambiguity.
    TransferSpec:
      type: object
      additionalProperties: false
      x-kcs-path-collision-policy: reject-existing-workspace-casefold-collision
      x-kcs-relations:
        - {left: declaredSizeBytes, operator: '<=', right: authorizedMaxSizeBytes}
      required: [direction, path, declaredSizeBytes, authorizedMaxSizeBytes, contentSha256, mode, overwritePolicy]
      properties:
        direction: {type: string, enum: [stage_input, collect_output]}
        path: {$ref: '#/components/schemas/SafeRelativePath'}
        declaredSizeBytes: {type: integer, minimum: 0, maximum: 107374182400}
        authorizedMaxSizeBytes: {type: integer, minimum: 0, maximum: 107374182400}
        contentSha256: {$ref: '#/components/schemas/Sha256'}
        mode: {type: string, const: direct}
        overwritePolicy: {type: string, enum: [forbid, replace_authorized]}
    TransferRegisterRequest:
      type: object
      additionalProperties: false
      required: [transferRef, requestDigest, spec]
      properties:
        transferRef: {$ref: '#/components/schemas/OpaqueRef'}
        requestDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/TransferSpec'}
