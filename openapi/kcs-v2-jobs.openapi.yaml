        OPERATION_INDETERMINATE: {status: 409, recoveryAction: inspect_operation}
        UNSUPPORTED_MEDIA_TYPE: {status: 415, recoveryAction: none}
        DIGEST_MISMATCH: {status: 422, recoveryAction: none}
        CREDENTIAL_DESTROY_FAILED: {status: 500, recoveryAction: reconcile}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
        DEPENDENCY_TIMEOUT: {status: 504, recoveryAction: retry_same}
      x-kcs-digest-projection:
        kind: rfc8785-jcs
        identity:
          - {in: path, name: jobRef}
          - {in: body, name: finalizeRef}
        digest: requestDigest
        digestLocation: body
        projection: {source: requestBody, field: spec}
      x-kcs-replay:
        newStatus: 202
        replayStatus: 200
        conflictStatus: 409
        conflictCode: IDENTITY_CONFLICT
        recoveryAction: inspect_job
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinalizeJobRequest'}
      responses:
        '202':
          description: Provider-only quiesce accepted; no research success is inferred.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobBindingSnapshot'}}}
        '200': *JobReplay
        '400': *Error400
        '401': *Error401
        '403': *Error403
        '404': *Error404
        '409': *Error409
        '415': *Error415
        '422': *Error422
        '500': *Error500
        '503': *Error503
        '504': *Error504
  /api/v2/jobs/{jobRef}/cancel:
    parameters:
      - {$ref: '#/components/parameters/JobRef'}
    post:
      tags: [Jobs]
      operationId: cancelJob
      x-kcs-service-authorization: v2-mutator
      x-kcs-error-codes:
        INVALID_REQUEST: {status: 400, recoveryAction: none}
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        NOT_FOUND: {status: 404, recoveryAction: none}
        IDENTITY_CONFLICT: {status: 409, recoveryAction: inspect_job}
        STATE_CONFLICT: {status: 409, recoveryAction: inspect_job}
        STALE_BINDING: {status: 409, recoveryAction: inspect_job}
        TRANSFER_INDETERMINATE: {status: 409, recoveryAction: inspect_transfer}
        UNSUPPORTED_MEDIA_TYPE: {status: 415, recoveryAction: none}
        DIGEST_MISMATCH: {status: 422, recoveryAction: none}
        CREDENTIAL_DESTROY_FAILED: {status: 500, recoveryAction: reconcile}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
        DEPENDENCY_TIMEOUT: {status: 504, recoveryAction: retry_same}
      x-kcs-digest-projection:
        kind: rfc8785-jcs
        identity:
          - {in: path, name: jobRef}
          - {in: body, name: cancelRef}
        digest: requestDigest
        digestLocation: body
        projection: {source: requestBody, field: spec}
      x-kcs-replay:
        newStatus: 202
        replayStatus: 200
        conflictStatus: 409
        conflictCode: IDENTITY_CONFLICT
        recoveryAction: inspect_job
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelJobRequest'}
      responses:
        '202':
          description: Interruption accepted; possible output loss is reported in the snapshot.
          content: {application/json: {schema: {$ref: '#/components/schemas/JobBindingSnapshot'}}}
        '200': *JobReplay
        '400': *Error400
        '401': *Error401
        '403': *Error403
        '404': *Error404
        '409': *Error409
        '415': *Error415
        '422': *Error422
        '500': *Error500
        '503': *Error503
        '504': *Error504
  /api/v2/capacity:
    get:
      tags: [Cluster observations]
      operationId: getCapacity
      x-kcs-service-authorization: v2-reader
      x-kcs-error-codes:
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      responses:
        '200':
          description: >-
            Fresh Kubernetes Node capacity, allocatable resources, and requests from
            KCS V2 managed Jobs. Requests are not resource utilization.
          content: {application/json: {schema: {$ref: '#/components/schemas/CapacitySnapshot'}}}
        '401': *Error401
        '403': *Error403
        '500': *Error500
        '503': *Error503
  /api/v2/queue:
    get:
      tags: [Cluster observations]
      operationId: getQueue
      x-kcs-service-authorization: v2-reader
      x-kcs-error-codes:
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
        DEPENDENCY_UNAVAILABLE: {status: 503, recoveryAction: retry_same}
      responses:
        '200':
          description: >-
            Fresh projection of KCS V2 managed Jobs that Kubernetes has not made ready;
            this is not a second scheduling queue.
          content: {application/json: {schema: {$ref: '#/components/schemas/QueueSnapshot'}}}
        '401': *Error401
        '403': *Error403
        '500': *Error500
        '503': *Error503
  /api/v2/openapi.json:
    get:
      tags: [Contract]
      operationId: getCanonicalOpenApi
      x-kcs-service-authorization: v2-reader
      x-kcs-error-codes:
        UNAUTHENTICATED: {status: 401, recoveryAction: none}
        FORBIDDEN: {status: 403, recoveryAction: none}
        INTERNAL_ERROR: {status: 500, recoveryAction: reconcile}
      x-kcs-cache-control: no-store
      responses:
        '200':
          description: Exact committed compact canonical OpenAPI JSON artifact.
          x-kcs-required-headers: [ETag, X-KCS-API-Version, Cache-Control]
          x-kcs-etag-derivation:
            algorithm: sha256
            source: exact-response-bytes
            encoding: lowercase-hex
          headers:
            ETag: {schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
            X-KCS-API-Version: {schema: {type: string, const: 2.2.0}}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenApiDocument'}
        '401': *NoStoreError
        '403': *NoStoreError
        '500': *NoStoreError
components:
  securitySchemes:
    v2ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
      description: >-
        Fail-closed KCS_V2_SERVICE_TOKEN over TLS; credential bytes are further
        restricted to the private ingress and credential-writer authorization role.
  parameters:
    JobRef: {name: jobRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    CredentialGrantRef: {name: credentialGrantRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TransferRef: {name: transferRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    OperationRef: {name: operationRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    Container: {name: container, in: query, required: true, schema: {type: string, enum: [agent, workspace]}}
    Cursor: {name: cursor, in: query, schema: {$ref: '#/components/schemas/OpaqueCursor'}}
    LogLimit: {name: limitBytes, in: query, schema: {type: integer, minimum: 1, maximum: 1048576, default: 65536}}
    PageToken: {name: pageToken, in: query, schema: {$ref: '#/components/schemas/OpaquePageToken'}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    ProviderRequestIdFilter: {name: providerRequestId, in: query, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    SubjectRefFilter: {name: subjectRef, in: query, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    StateFilter:
      name: state
      in: query
      style: form
      explode: true
      schema: {type: array, items: {$ref: '#/components/schemas/JobBindingState'}}
    CreatedAfterFilter: {name: createdAfter, in: query, schema: {$ref: '#/components/schemas/Timestamp'}}
    IncludeDeletedFilter: {name: includeDeleted, in: query, schema: {type: boolean, default: false}}
    DeleteRefHeader: {name: KCS-Delete-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    DiscardRefHeader: {name: KCS-Discard-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    RequestDigestHeader: {name: KCS-Request-Digest, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    CredentialGrantRefHeader: {name: KCS-Credential-Grant-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    CredentialSha256Header: {name: KCS-Credential-SHA256, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    GrantMetadataDigestHeader: {name: KCS-Grant-Metadata-Digest, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    AgentRunRefHeader: {name: KCS-Agent-Run-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    GenerationHeader: {name: KCS-Generation, in: header, required: true, schema: {type: integer, minimum: 1}}
    LaunchBundleDigestHeader: {name: KCS-Launch-Bundle-Digest, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    AudienceHeader: {name: KCS-Audience, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    JobUidHeader: {name: KCS-Job-UID, in: header, required: true, schema: {$ref: '#/components/schemas/KubernetesUid'}}
    PodUidHeader: {name: KCS-Pod-UID, in: header, required: true, schema: {$ref: '#/components/schemas/KubernetesUid'}}
    CredentialTtlHeader: {name: KCS-Credential-TTL-Seconds, in: header, required: true, schema: {type: integer, minimum: 1, maximum: 900}}
    ContentSha256Header: {name: KCS-Content-SHA256, in: header, required: true, schema: {$ref: '#/components/schemas/Sha256'}}
    ContentLengthHeader: {name: Content-Length, in: header, required: true, schema: {type: integer, minimum: 0, maximum: 107374182400}}
    OperationRefHeader: {name: KCS-Operation-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TerminalRef: {name: terminalRef, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TerminalSubject: {name: KCS-Subject-Ref, in: header, required: true, schema: {$ref: '#/components/schemas/OpaqueRef'}}
    TerminalCredential: {name: KCS-Terminal-Credential, in: header, required: true, schema: {type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}}
  headers:
    NoStore: {schema: {type: string, const: no-store}}
    TerminalCredential: {schema: {type: string, minLength: 32, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}}
  responses:
    BadRequest: *Error400
    Unauthorized: *Error401
    Forbidden: *Error403
    NotFound: *Error404
    Conflict: *Error409
    Gone:
      description: Resource is no longer retained.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    TooLarge: *Error413
    UnsupportedMediaType: *Error415
    Unprocessable: *Error422
    TooManyRequests: *Error429
    InternalError: *Error500
    Unavailable: *Error503
    Timeout: *Error504
  schemas:
    OpaqueRef:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[^\u0000-\u001f\u007f]+$'
      x-kcs-maxUtf8Bytes: 256
    OpaqueCursor:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: '^[A-Za-z0-9_-]+$'
      format: kcs-base64url
      x-kcs-maxUtf8Bytes: 4096
      description: Opaque base64url cursor bound to namespace, job, immutable Pod UID, and role.
    OpaquePageToken:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: '^[A-Za-z0-9_-]+$'
      format: kcs-base64url
      x-kcs-maxUtf8Bytes: 4096
      description: Opaque base64url token bound to namespace and the complete filter set.
    Sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    KubernetesUid: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    NullableTimestamp:
      oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
    NullableString:
      oneOf: [{type: string}, {type: 'null'}]
    NullableInteger:
      oneOf: [{type: integer}, {type: 'null'}]
    NullableBoolean:
      oneOf: [{type: boolean}, {type: 'null'}]
    NullableOpaqueRef:
      oneOf: [{$ref: '#/components/schemas/OpaqueRef'}, {type: 'null'}]
    NullableSha256:
      oneOf: [{$ref: '#/components/schemas/Sha256'}, {type: 'null'}]
    Environment:
      type: object
      maxProperties: 32
      propertyNames:
        type: string
        maxLength: 64
        pattern: '^(LANG|LC_ALL|TZ|HTTP_PROXY|HTTPS_PROXY|NO_PROXY|RC_PUBLIC_RUNTIME_BASE_URL)$'
        x-kcs-maxUtf8Bytes: 64
      additionalProperties:
        type: string
        maxLength: 2048
        x-kcs-maxUtf8Bytes: 2048
        format: kcs-non-secret-runtime-value
      x-kcs-secret-value-policy: reject-secret-shaped-values
    NodeSelector:
      type: object
      additionalProperties: false
      required: [researchcosmos.io/pool]
      properties:
        researchcosmos.io/pool: {type: string, const: gpu}
    QueueReason:
      type: string
      enum: [unschedulable, image_pull, quota, provisioning, unknown]
    GpuCapacitySnapshot:
      type: object
      additionalProperties: false
      required: [kind, capacity, allocatable, requestedByManagedJobs]
      properties:
        kind: {type: string, const: nvidia.com/gpu}
        capacity: {type: integer, minimum: 0}
        allocatable: {type: integer, minimum: 0}
        requestedByManagedJobs: {type: integer, minimum: 0}
    CpuCapacitySnapshot:
      type: object
      additionalProperties: false
      required: [capacityMilli, allocatableMilli, requestedByManagedJobsMilli]
      properties:
        capacityMilli: {type: integer, minimum: 0}
        allocatableMilli: {type: integer, minimum: 0}
        requestedByManagedJobsMilli: {type: integer, minimum: 0}
    MemoryCapacitySnapshot:
      type: object
      additionalProperties: false
      required: [capacityBytes, allocatableBytes, requestedByManagedJobsBytes]
      properties:
        capacityBytes: {type: integer, minimum: 0}
        allocatableBytes: {type: integer, minimum: 0}
        requestedByManagedJobsBytes: {type: integer, minimum: 0}
    CapacityNodeSnapshot:
      type: object
      additionalProperties: false
      required: [displayComputeNode, pool, ready, conditions, gpu, cpu, memory, managedJobCount]
      properties:
        displayComputeNode: {type: string, minLength: 1, maxLength: 128}
        pool: {type: string, minLength: 1, maxLength: 128}
        ready: {type: boolean}
        conditions:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        gpu: {$ref: '#/components/schemas/GpuCapacitySnapshot'}
        cpu: {$ref: '#/components/schemas/CpuCapacitySnapshot'}
        memory: {$ref: '#/components/schemas/MemoryCapacitySnapshot'}
        managedJobCount: {type: integer, minimum: 0}
    CapacitySnapshot:
      type: object
      additionalProperties: false
      required: [observedAt, nodes]
      properties:
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/CapacityNodeSnapshot'}
    QueueRequestedResources:
      type: object
      additionalProperties: false
      required: [gpu, cpuMilli, memoryBytes]
      properties:
        gpu: {type: integer, minimum: 0}
        cpuMilli: {type: integer, minimum: 0}
        memoryBytes: {type: integer, minimum: 0}
    PendingJobSnapshot:
      type: object
      additionalProperties: false
      required: [jobRef, subjectRef, createdAt, reason, message, requested]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        reason: {$ref: '#/components/schemas/QueueReason'}
        message: {type: string, maxLength: 512, x-kcs-maxUtf8Bytes: 512}
        requested: {$ref: '#/components/schemas/QueueRequestedResources'}
    QueueSnapshot:
      type: object
      additionalProperties: false
      required: [observedAt, pending]
      properties:
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        pending:
          type: array
          items: {$ref: '#/components/schemas/PendingJobSnapshot'}
    NvidiaDeviceTelemetry:
      type: object
      additionalProperties: false
      required: [deviceId, utilizationPercent, memoryUsedMiB, memoryTotalMiB, temperatureCelsius]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 128}
        utilizationPercent: {type: integer, minimum: 0, maximum: 100}
        memoryUsedMiB: {type: integer, minimum: 0}
        memoryTotalMiB: {type: integer, minimum: 1}
        temperatureCelsius: {type: integer, minimum: -100, maximum: 250}
    NvidiaTelemetrySnapshot:
      type: object
      additionalProperties: false
      required: [jobRef, jobUid, podUid, computeNode, observedAt, devices]
      properties:
        jobRef: {$ref: '#/components/schemas/OpaqueRef'}
        jobUid: {$ref: '#/components/schemas/KubernetesUid'}
        podUid: {$ref: '#/components/schemas/KubernetesUid'}
        computeNode: {type: string, minLength: 1, maxLength: 128}
        observedAt: {$ref: '#/components/schemas/Timestamp'}
        devices: {type: array, minItems: 1, items: {$ref: '#/components/schemas/NvidiaDeviceTelemetry'}}
    AgentResources:
      type: object
      additionalProperties: false
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 8000, default: 1000}
        memoryMiB: {type: integer, minimum: 1, maximum: 32768, default: 2048}
    WorkspaceResources:
      type: object
      additionalProperties: false
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 64000, default: 2000}
        memoryMiB: {type: integer, minimum: 1, maximum: 262144, default: 8192}
        gpu: {type: integer, minimum: 0, maximum: 8, default: 0}
    AgentSpec:
      type: object
      additionalProperties: false
      required: [image, command]
      properties:
        image: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        command: {type: array, const: [/opt/kcs/agent-supervisor]}
        resources: {$ref: '#/components/schemas/AgentResources'}
        runtimeEnv: {$ref: '#/components/schemas/Environment'}
    WorkspaceSpec:
      type: object
      additionalProperties: false
      required: [image, command]
      properties:
        image: {type: string, pattern: '^.+@sha256:[0-9a-f]{64}$'}
        command: {type: array, const: [/opt/kcs/workspace-sidecar]}
        resources: {$ref: '#/components/schemas/WorkspaceResources'}
        runtimeEnv: {$ref: '#/components/schemas/Environment'}
    SharedWorkspaceSpec:
      type: object
      additionalProperties: false
      required: [kind, mountPath, sizeLimitGiB]
      properties:
        kind: {type: string, const: ephemeral}
        mountPath: {type: string, const: /workspace}
        sizeLimitGiB: {type: integer, minimum: 1, maximum: 100, default: 20}
    JobSpec:
      type: object
      additionalProperties: false
      x-kcs-default-semantics: omission-is-distinct
      required: [subjectRef, runtimePlanDigest, agent, workspace, sharedWorkspace, nodeSelector, activeDeadlineSeconds]
      properties:
        subjectRef: {$ref: '#/components/schemas/OpaqueRef'}
        runtimePlanDigest: {$ref: '#/components/schemas/Sha256'}
        agent: {$ref: '#/components/schemas/AgentSpec'}
        workspace: {$ref: '#/components/schemas/WorkspaceSpec'}
        sharedWorkspace: {$ref: '#/components/schemas/SharedWorkspaceSpec'}
        nodeSelector: {$ref: '#/components/schemas/NodeSelector'}
        activeDeadlineSeconds: {type: integer, minimum: 1, maximum: 86400, default: 21600}
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [providerRequestId, specDigest, spec]
      properties:
        providerRequestId: {$ref: '#/components/schemas/OpaqueRef'}
        specDigest: {$ref: '#/components/schemas/Sha256'}
        spec: {$ref: '#/components/schemas/JobSpec'}
    JobBindingState: {type: string, enum: [provisioning, bound, running, finalizing, succeeded, failed, canceling, canceled, indeterminate, deleting, deleted]}
    ProviderTerminalState: {type: string, enum: [succeeded, failed, canceled, indeterminate]}
    RoleState: {type: string, enum: [waiting, running, terminated, unknown, indeterminate]}
    RunnerState: {type: string, enum: [not_started, accepted, starting, running, exited, failed, indeterminate]}
    CredentialState: {type: string, enum: [accepted, available, acknowledged, consumed, destroyed, expired, revoked, destroy_failed, indeterminate]}
    TransferState: {type: string, enum: [registered, staging, available, streaming, completed, canceling, canceled, discarded, failed, indeterminate]}
    OperationState: {type: string, enum: [accepted, running, succeeded, failed, indeterminate]}
    ActionState: {type: string, enum: [not_requested, accepted, running, succeeded, failed, indeterminate]}
    CleanupState: {type: string, enum: [not_required, pending, complete, failed, indeterminate]}
    AgentRequestedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 8000}
        memoryMiB: {type: integer, minimum: 1, maximum: 32768}
        gpu: {type: integer, const: 0}
        storageGiB: {type: integer, minimum: 1, maximum: 100}
    AgentObservedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {oneOf: [{type: integer, minimum: 0, maximum: 8000}, {type: 'null'}]}
        memoryMiB: {oneOf: [{type: integer, minimum: 0, maximum: 32768}, {type: 'null'}]}
        gpu: {oneOf: [{type: integer, const: 0}, {type: 'null'}]}
        storageGiB: {oneOf: [{type: integer, minimum: 0, maximum: 100}, {type: 'null'}]}
    WorkspaceRequestedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {type: integer, minimum: 1, maximum: 64000}
        memoryMiB: {type: integer, minimum: 1, maximum: 262144}
        gpu: {type: integer, minimum: 0, maximum: 8}
        storageGiB: {type: integer, minimum: 1, maximum: 100}
    WorkspaceObservedResources:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryMiB, gpu, storageGiB]
      properties:
        cpuMillis: {oneOf: [{type: integer, minimum: 0, maximum: 64000}, {type: 'null'}]}
        memoryMiB: {oneOf: [{type: integer, minimum: 0, maximum: 262144}, {type: 'null'}]}
        gpu: {oneOf: [{type: integer, minimum: 0, maximum: 8}, {type: 'null'}]}
        storageGiB: {oneOf: [{type: integer, minimum: 0, maximum: 100}, {type: 'null'}]}
    AgentRoleSnapshot:
      type: object
      additionalProperties: false
      required: [containerId, imageId, state, ready, restartCount, exitCode, reason, startedAt, finishedAt, requested, observed]
      properties:
        containerId: {$ref: '#/components/schemas/NullableString'}
        imageId: {$ref: '#/components/schemas/NullableString'}
        state: {$ref: '#/components/schemas/RoleState'}
        ready: {type: boolean}
        restartCount: {type: integer, minimum: 0}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        reason: {$ref: '#/components/schemas/NullableString'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        finishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        requested: {$ref: '#/components/schemas/AgentRequestedResources'}
        observed: {$ref: '#/components/schemas/AgentObservedResources'}
    WorkspaceRoleSnapshot:
      type: object
      additionalProperties: false
      required: [containerId, imageId, state, ready, restartCount, exitCode, reason, startedAt, finishedAt, requested, observed]
      properties:
        containerId: {$ref: '#/components/schemas/NullableString'}
        imageId: {$ref: '#/components/schemas/NullableString'}
        state: {$ref: '#/components/schemas/RoleState'}
        ready: {type: boolean}
        restartCount: {type: integer, minimum: 0}
        exitCode: {$ref: '#/components/schemas/NullableInteger'}
        reason: {$ref: '#/components/schemas/NullableString'}
        startedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        finishedAt: {$ref: '#/components/schemas/NullableTimestamp'}
        requested: {$ref: '#/components/schemas/WorkspaceRequestedResources'}
        observed: {$ref: '#/components/schemas/WorkspaceObservedResources'}
    PodIncarnationState: {type: string, enum: [pending, running, succeeded, failed, unknown]}
    PodIncarnationSnapshot:
      type: object
